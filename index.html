<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>キャラクター名前トレーナー</title>
<style>
  :root {
    --bg: #F3F4F7; --surface: #FFFFFF; --surface-2: #E9EBF0; --line: #D3D7E0;
    --text: #1A1D24; --muted: #666E7E; --accent: #4F5BD5;
    --ok: #1F7A4D; --ok-bg: #DFF3E7; --ng: #A33A2A; --ng-bg: #FBE4DF;
    --shadow: 0 1px 3px rgba(20,24,35,.10), 0 6px 20px rgba(20,24,35,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161B; --surface: #1E212A; --surface-2: #272B36; --line: #343A48;
      --text: #E9EBF0; --muted: #98A0B0; --accent: #8B95F5;
      --ok: #6FD59B; --ok-bg: #1B3227; --ng: #F0907C; --ng-bg: #33201C;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161B; --surface: #1E212A; --surface-2: #272B36; --line: #343A48;
    --text: #E9EBF0; --muted: #98A0B0; --accent: #8B95F5;
    --ok: #6FD59B; --ok-bg: #1B3227; --ng: #F0907C; --ng-bg: #33201C;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body, button, .chip, .tile, .choice, .th, .imgwrap { touch-action: manipulation; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.6;
    display: flex; flex-direction: column; overscroll-behavior-y: contain;
  }
  header {
    padding: max(12px, env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--line); background: var(--surface);
    display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  header .count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 24px; }
  .panel { display: none; }
  .panel.active { display: block; }

  nav {
    display: flex; border-top: 1px solid var(--line); background: var(--surface);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 11px 4px 13px; font: inherit; font-size: 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border-top: 2px solid transparent; margin-top: -1px;
  }
  nav button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  nav button[aria-selected="true"] { color: var(--accent); border-top-color: var(--accent); }

  button, select, input, textarea { font: inherit; color: inherit; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 11px 16px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; font-weight: 500; transition: transform .06s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.wide { width: 100%; }
  .btn.sm { padding: 10px 12px; font-size: 14px; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:focus-visible, select:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* chips */
  .chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
  .chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .chip[aria-pressed="true"]::before { content: "✓ "; font-size: 12px; }
  .chip .n { opacity: .7; font-size: 12px; margin-left: 5px; font-variant-numeric: tabular-nums; }

  #stage { display: flex; flex-direction: column; gap: 14px; }
  .imgwrap {
    position: relative; width: 100%; aspect-ratio: 1/1; max-height: 44vh;
    border-radius: var(--radius); overflow: hidden; background: var(--surface-2);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  }
  .imgwrap img { width: 100%; height: 100%; object-fit: contain; }
  .prompt-name { font-size: 30px; font-weight: 600; text-align: center; padding: 34px 16px; letter-spacing: .02em; }
  .answer-slot { min-height: 62px; display: flex; align-items: center; justify-content: center; }
  .reveal-btn {
    width: 100%; padding: 17px; border-radius: 12px; border: 1px dashed var(--line);
    background: var(--surface-2); color: var(--muted); cursor: pointer;
  }
  .answer-name { font-size: 28px; font-weight: 600; text-align: center; letter-spacing: .02em; animation: rise .22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .answer-name { animation: none; } }
  .answer-note { font-size: 14px; color: var(--muted); text-align: center; margin-top: 2px; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .choice {
    padding: 15px 10px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; text-align: center; font-size: 16px;
    min-height: 58px; word-break: break-word;
  }
  .choice.correct { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .choice.wrong { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); }
  .choice-img { padding: 6px; aspect-ratio: 1/1; }
  .choice-img img { width: 100%; height: 100%; object-fit: contain; }

  .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .grade .again { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); }
  .grade .good { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .grade button { padding: 15px; font-weight: 600; }

  .meta-row { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .pill { padding: 3px 9px; border-radius: 99px; background: var(--surface-2); font-size: 12px; }
  .seg { display: flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 3px; }
  .seg button {
    flex: 1; padding: 10px 6px; border: none; background: none; border-radius: 9px;
    color: var(--muted); font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] {
    background: var(--accent); color: #fff; font-weight: 600;
  }
  .segrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .groupsel {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); margin-bottom: 10px;
  }
  .settings { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .settings select {
    padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .tile {
    position: relative; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; cursor: pointer;
  }
  .tile .th { aspect-ratio: 1/1; background: var(--surface-2); display: flex; }
  .tile .th img { width: 100%; height: 100%; object-fit: contain; }
  .tile .nm { padding: 7px 8px 8px; font-size: 13px; line-height: 1.35; word-break: break-word; }
  .tile .lv { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .tick {
    position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface); border: 1.5px solid var(--line); display: none;
    align-items: center; justify-content: center; font-size: 14px; color: #fff;
  }
  body.selecting .tick { display: flex; }
  .tile[aria-checked="true"] .tick { background: var(--accent); border-color: var(--accent); }

  .actionbar {
    display: flex; gap: 8px; padding: 10px 16px;
    background: var(--surface); border-top: 1px solid var(--line);
  }
  .actionbar[hidden] { display: none; }
  .actionbar .btn { flex: 1; }

  .memo-item {
    display: flex; gap: 12px; align-items: center; padding: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 9px;
  }
  .memo-th {
    flex: 0 0 auto; width: 96px; height: 96px; border-radius: 9px; overflow: hidden;
    background: var(--surface-2); cursor: pointer;
  }
  .memo-th img { width: 100%; height: 100%; object-fit: contain; }
  .memo-text { min-width: 0; flex: 1; }
  .memo-name { font-size: 19px; font-weight: 600; word-break: break-word; line-height: 1.35; }
  .memo-name.masked {
    font-size: 0;                     /* 隠している名前が場所を取らないようにする */
    color: transparent;
    background: var(--surface-2); border: 1px dashed var(--line); border-radius: 9px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    min-height: 46px; padding: 0 12px;
  }
  .memo-name.masked::after {
    content: "タップで表示"; color: var(--muted); font-size: 14px; font-weight: 400;
    line-height: 1; white-space: nowrap;
  }
  .memo-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .memo-note { font-size: 13px; color: var(--muted); margin-top: 5px; white-space: pre-wrap; }

  .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px,1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { padding: 14px; }
  .stat b { display: block; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { font-weight: 500; color: var(--muted); font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  h3 { font-size: 15px; margin: 18px 0 6px; font-weight: 600; }

  dialog {
    border: none; border-radius: 16px; padding: 0; background: var(--surface); color: var(--text);
    width: min(440px, calc(100vw - 32px)); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg-body { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .dlg-body img { width: 130px; height: 130px; object-fit: contain; align-self: center; background: var(--surface-2); border-radius: 12px; }
  .dlg-body h2 { margin: 0; font-size: 17px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=text], textarea, select {
    font-size: 16px;                     /* これ未満だと入力時に画面が拡大される */
  }
  input[type=text], textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
  }
  textarea { resize: vertical; min-height: 58px; }
  .dlg-actions { display: flex; gap: 8px; }
  .dlg-actions .btn { flex: 1; }
  .danger { color: var(--ng); }

  dialog.viewer { width: min(560px, calc(100vw - 20px)); max-width: none; }
  .view-body { position: relative; }
  .view-close {
    position: absolute; top: 8px; right: 8px; z-index: 2; width: 34px; height: 34px;
    border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1;
  }
  .view-stage {
    position: relative; background: var(--surface-2); display: flex;
    align-items: center; justify-content: center; border-radius: 16px 16px 0 0; overflow: hidden;
  }
  .view-stage img { width: 100%; max-height: 66vh; object-fit: contain; display: block; }
  .view-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 52px;
    border: none; background: rgba(0,0,0,.34); color: #fff; font-size: 26px; line-height: 1;
    cursor: pointer; border-radius: 8px;
  }
  .view-nav.prev { left: 6px; } .view-nav.next { right: 6px; }
  .view-nav:disabled { opacity: 0; pointer-events: none; }
  .view-info { padding: 14px 16px 10px; }
  .view-name { font-size: 21px; font-weight: 600; }
  .view-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .view-note { font-size: 14px; margin-top: 8px; white-space: pre-wrap; }

  .searchbox {
    width: 100%; padding: 11px 13px; margin-bottom: 10px; font-size: 16px;
    border-radius: 11px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); -webkit-appearance: none;
  }
  .searchbox::-webkit-search-cancel-button { -webkit-appearance: searchfield-cancel-button; }
  .hitcount { font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  .banner {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 14px; margin-bottom: 12px; border-radius: 12px;
    background: var(--ng-bg); border: 1px solid var(--ng); color: var(--ng); font-size: 14px;
  }
  .banner .btn { color: var(--text); background: var(--surface); border-color: var(--line); }

  .empty { text-align: center; padding: 38px 16px; color: var(--muted); }
  .empty h2 { color: var(--text); font-size: 19px; margin: 0 0 8px; }
  .empty p { margin: 0 auto 18px; max-width: 34ch; font-size: 14px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .hint code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(76px + env(safe-area-inset-bottom)); background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 99px; font-size: 14px; z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .filebtn input { display: none; }
  /* タグ */
  .chip.tagchip { border-style: dashed; }
  .chip.tagchip[aria-pressed="true"] { border-style: solid; }
  .chip.addchip { color: var(--accent); border: 1px dashed var(--accent); }
  .tagpick { display: flex; flex-wrap: wrap; gap: 6px; max-height: 140px; overflow-y: auto; padding: 2px; }
  .tagpick .chip { font-size: 13px; padding: 5px 11px; }
  .tagrow { display: flex; gap: 8px; margin-top: 8px; }
  .tagrow input { flex: 1; min-width: 0; }
  .tags-inline { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .tagmini {
    font-size: 12px; line-height: 1.5; padding: 1px 9px; border-radius: 99px; border: none;
    background: var(--surface-2); color: var(--muted);
  }
  button.tagmini { cursor: pointer; font-size: 13px; padding: 3px 11px; color: var(--accent); }
  .checkline { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); margin: 0; }
  .checkline input { width: 18px; height: 18px; margin: 0; }
  #blocker {
    position: fixed; inset: 0; z-index: 100; background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 28px; font-size: 15px; line-height: 1.9;
  }
</style>
</head>
<body>

<header>
  <h1>キャラクター名前トレーナー</h1>
  <span class="count" id="headCount"></span>
</header>

<main>
  <!-- ============ 学習 ============ -->
  <section class="panel active" id="panel-study">
    <div class="chips" id="studyFolders"></div>
    <div class="segrow">
      <div class="seg" id="setMode" data-value="recall">
        <button data-v="recall">自由想起</button><button data-v="choice4">4択</button>
      </div>
      <div class="seg" id="setDir" data-value="i2n">
        <button data-v="i2n">画像→名前</button><button data-v="n2i">名前→画像</button>
      </div>
    </div>
    <div class="segrow">
      <div class="seg" id="setScope" data-value="all">
        <button data-v="all">すべて</button><button data-v="weak">苦手だけ</button>
      </div>
      <div class="seg" id="setCount" data-value="10">
        <button data-v="10">10問</button><button data-v="20">20問</button>
        <button data-v="30">30問</button><button data-v="all">全部</button>
      </div>
    </div>
    <select id="setGroup" class="groupsel" hidden><option value="">グループ：すべて</option></select>
    <div id="stage"></div>
  </section>

  <!-- ============ 覚える ============ -->
  <section class="panel" id="panel-memo">
    <input type="search" id="memoSearch" class="searchbox" placeholder="名前・#タグで検索" autocomplete="off">
    <div class="chips" id="memoFolders"></div>
    <div class="seg" id="memoName" data-value="show" style="margin-bottom:10px">
      <button data-v="show">名前を見せる</button><button data-v="hide">名前を隠す</button>
    </div>
    <div id="memoBody"></div>
  </section>

  <!-- ============ 一覧 ============ -->
  <section class="panel" id="panel-list">
    <div class="settings">
      <label class="btn filebtn" style="margin:0">画像を追加
        <input type="file" id="fileInput" accept="image/*" multiple></label>
      <label class="btn filebtn" id="dirBtnWrap" style="margin:0">フォルダごと追加
        <input type="file" id="dirInput" webkitdirectory directory multiple></label>
      <button class="btn" id="selectBtn">選択</button>
      <button class="btn" id="exportBtn">CSVで一覧</button>
    </div>
    <input type="search" id="listSearch" class="searchbox" placeholder="名前・#タグで検索" autocomplete="off">
    <div id="fixBanner" hidden>
      <div class="banner">
        <span id="fixMsg"></span>
        <label class="btn sm filebtn" style="margin:0">まとめて入れ直す
          <input type="file" id="fixInput" accept="image/*" multiple></label>
      </div>
    </div>
    <div class="chips" id="listFolders"></div>
    <div id="listBody"></div>
  </section>

  <!-- ============ 記録 ============ -->
  <section class="panel" id="panel-stats"><div id="statsBody"></div></section>
</main>

<div class="actionbar" id="actionBar" hidden>
  <button class="btn sm" id="selAll">全選択</button>
  <button class="btn sm primary" id="selMove">移動</button>
  <button class="btn sm" id="selTag">タグ</button>
  <button class="btn sm danger" id="selDel">削除</button>
</div>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="study">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H4z"/><path d="M9 20h6"/><path d="M12 16v4"/></svg>学習</button>
  <button role="tab" aria-selected="false" data-tab="memo">
    <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M9 7h6"/></svg>覚える</button>
  <button role="tab" aria-selected="false" data-tab="list">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>一覧</button>
  <button role="tab" aria-selected="false" data-tab="stats">
    <svg viewBox="0 0 24 24"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>記録</button>
</nav>

<dialog id="editDlg">
  <form method="dialog" class="dlg-body">
    <img id="edImg" alt="">
    <div><label for="edName">名前</label><input type="text" id="edName" autocomplete="off"></div>
    <div><label for="edFolder">フォルダ</label>
      <input type="text" id="edFolder" autocomplete="off" list="folderList" placeholder="未分類">
      <datalist id="folderList"></datalist></div>
    <div><label for="edGroup">グループ（似たもの同士をまとめると4択が難しくなります）</label>
      <input type="text" id="edGroup" autocomplete="off" list="groupList">
      <datalist id="groupList"></datalist></div>
    <div><label>タグ（いくつでも付けられます。タップで付け外し）</label>
      <div class="tagpick" id="edTags"></div>
      <div class="tagrow">
        <input type="text" id="edTagNew" autocomplete="off" enterkeyhint="done" placeholder="新しいタグを入力">
        <button class="btn sm" type="button" id="edTagAdd">追加</button>
      </div></div>
    <div><label for="edNote">覚える手がかり</label>
      <textarea id="edNote" placeholder="髪の色、持ち物、他と見分ける決め手など"></textarea></div>

    <h2>タグで振り分け</h2>
    <div style="font-size:14px;color:var(--muted)">選んだタグは、フォルダ欄に「#タグ」として並びます。
      そのタグが付いたキャラが自動で入ります。コピーではないので、学習記録は1つのままです。</div>
    <div class="tagpick" id="tfPick" style="max-height:48vh"></div>
    <div class="dlg-actions"><button class="btn primary" value="close" type="submit">閉じる</button></div>
  </form>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============ ストレージ ============ */
// v16 から、キャラ情報（cards）と画像（images）を別々の場所に保存する。
// 学習のたびに書き換わるのはキャラ情報だけにして、画像のレコードには触れない。
// 画像を含むレコードを上書きすると、手元に持っていた画像が
// 「大きさは分かるのに中身が読めない」状態になることがあるため。
const DB_NAME = "charTrainer", STORE = "cards", IMG_STORE = "images", DB_VERSION = 2;
let db = null;
function showBlocker(html) {
  let el = document.getElementById("blocker");
  if (!el) { el = document.createElement("div"); el.id = "blocker"; document.body.appendChild(el); }
  el.innerHTML = html;
}
function hideBlocker() { const el = document.getElementById("blocker"); if (el) el.remove(); }

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: "id" });
      if (!d.objectStoreNames.contains(IMG_STORE)) d.createObjectStore(IMG_STORE, { keyPath: "id" });
    };
    // 古い版を開いたままのタブがあると、更新が始まらない
    req.onblocked = () => showBlocker("このアプリの古い版が、別のタブで開いたままです。<br>そのタブを閉じると、自動で続きが始まります。");
    req.onsuccess = () => {
      hideBlocker();
      const d = req.result;
      d.onversionchange = () => {      // さらに新しい版が開かれたら、こちらが譲る
        d.close();
        showBlocker("新しい版が別のタブで開かれました。<br>このタブは閉じるか、再読み込みしてください。");
      };
      resolve(d);
    };
    req.onerror = () => reject(req.error);
  });
}

// 書き込みは、最後まで保存し終えてから返す
function txDone(names, mode, work) {
  return new Promise((resolve, reject) => {
    let t, out;
    try { t = db.transaction(names, mode); } catch (e) { reject(e); return; }
    t.oncomplete = () => resolve(out);
    t.onabort = () => reject(t.error || new Error("保存が中断されました"));
    try { out = work(t); } catch (e) { try { t.abort(); } catch (_) {} reject(e); }
  });
}
const idbAll = name => new Promise((res, rej) => {
  const r = db.transaction(name, "readonly").objectStore(name).getAll();
  r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
});
const idbGet = (name, key) => new Promise((res, rej) => {
  const r = db.transaction(name, "readonly").objectStore(name).get(key);
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});

const blobSize = b => (b && typeof b.size === "number") ? b.size : 0;
const hasBlobs = v => !!(v && (v.display || v.thumb || v.blob));
// 保存するキャラ情報（画像は含めない）
const metaOf = c => ({
  id: c.id, name: c.name, folder: c.folder || "", group: c.group || "", note: c.note || "",
  level: c.level || 0, due: c.due || today(), ok: c.ok || 0, ng: c.ng || 0, seen: c.seen || 0, lost: !!c.lost,
  tags: tagsOf(c).slice()
});

// キャラ情報だけを書き込む。画像がまだ同じレコードに残っている（旧形式の）場合は、
// 同じ処理の中で読み直してそのまま引き継ぐ
function saveCards(list) {
  if (!list.length) return Promise.resolve();
  return txDone([STORE], "readwrite", t => {
    const os = t.objectStore(STORE);
    for (const c of list) {
      const meta = metaOf(c);
      const g = os.get(c.id);
      g.onsuccess = () => os.put(g.result ? { ...g.result, ...meta } : meta);
    }
  });
}
const saveCard = c => saveCards([c]);

// 新しいキャラを、情報と画像を一度に登録する
function addCard(meta, img) {
  return txDone([STORE, IMG_STORE], "readwrite", t => {
    t.objectStore(STORE).put(meta);
    t.objectStore(IMG_STORE).put(img);
  }).then(() => noteImgInfo(meta.id, img));
}

// 既存のキャラの画像を差し替える。旧形式の画像が残っていれば、同時に外す
function writeImage(card, img) {
  return txDone([STORE, IMG_STORE], "readwrite", t => {
    t.objectStore(IMG_STORE).put(img);
    const os = t.objectStore(STORE);
    const g = os.get(card.id);
    g.onsuccess = () => {
      const n = { ...(g.result || {}), ...metaOf(card) };
      delete n.display; delete n.thumb; delete n.blob;
      os.put(n);
    };
  }).then(() => { noteImgInfo(card.id, img); forgetImage(card.id); oldStyle.delete(card.id); });
}

function deleteCards(ids) {
  return txDone([STORE, IMG_STORE], "readwrite", t => {
    for (const id of ids) { t.objectStore(STORE).delete(id); t.objectStore(IMG_STORE).delete(id); }
  }).then(() => ids.forEach(id => { imgInfo.delete(id); oldStyle.delete(id); forgetImage(id); }));
}

/* ---- v15 までの形式からの移行 ---- */
// (1)画像を images へ写す →(2)写したものが読めるか確かめる →(3)確かめられたものだけ元から外す
// どの段階で止まっても、画像はどちらかに必ず残る
const oldStyle = new Set();        // 移行できず、旧形式のまま残っているキャラ
async function migrateImages() {
  const copied = [];
  await txDone([STORE, IMG_STORE], "readwrite", t => {
    const cs = t.objectStore(STORE), is = t.objectStore(IMG_STORE);
    cs.openCursor().onsuccess = e => {
      const cur = e.target.result;
      if (!cur) return;
      const v = cur.value;
      if (!hasBlobs(v)) { cur.continue(); return; }
      const g = is.get(v.id);
      g.onsuccess = () => {
        const ex = g.result;
        if (!(ex && (blobSize(ex.display) || blobSize(ex.thumb)))) {
          is.put({ id: v.id, display: v.display || null, thumb: v.thumb || null,
                   blob: (v.display || v.thumb) ? null : (v.blob || null) });
        }
        copied.push(v.id);
        cur.continue();
      };
    };
  });
  if (!copied.length) return { moved: 0, kept: 0 };

  const verified = new Set();
  for (const id of copied) {
    const rec = await idbGet(IMG_STORE, id).catch(() => null);
    if (!rec) continue;
    if (await readable(rec.display || rec.thumb || rec.blob) &&
        (!rec.thumb || await readable(rec.thumb))) verified.add(id);
  }
  await txDone([STORE], "readwrite", t => {
    t.objectStore(STORE).openCursor().onsuccess = e => {
      const cur = e.target.result;
      if (!cur) return;
      const v = cur.value;
      if (hasBlobs(v) && verified.has(v.id)) {
        const n = { ...v };
        delete n.display; delete n.thumb; delete n.blob;
        cur.update(n);
      }
      cur.continue();
    };
  });
  return { moved: verified.size, kept: copied.length - verified.size };
}

// 中身を最後まで読み出せるか確かめる
function readable(b) {
  return new Promise(res => {
    if (!blobSize(b)) return res(false);
    const r = new FileReader();
    r.onload = () => res(!!r.result && r.result.byteLength === b.size);
    r.onerror = () => res(false);
    r.readAsArrayBuffer(b);
  });
}

/* ============ 状態 ============ */
let cards = [];
let current = null;
let studyFolders = new Set();      // 学習で選んでいるフォルダ（空＝すべて）
let studyTags = new Set();         // 学習で選んでいるタグフォルダ
let listFolder = null;             // 一覧で開いているフォルダ（null＝すべて）
let listTag = null;                // 一覧で開いているタグフォルダ（null＝なし）
let selecting = false;
const selected = new Set();
const APP_VERSION = "v17";        // 画面に表示して、どの版が動いているか確認できるようにする
const UNFILED = "未分類";
const FOLDER_MAX = 100;           // 1フォルダに入れられる上限
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fld = c => c.folder || UNFILED;

// 画像は表示のたびに保存領域から読み直し、文字列（data URL）にしてから使う。
// 文字列にしてしまえば、保存側のレコードが書き換わっても読めなくなることがない。
const thumbCache = new Map();      // id → 一覧用の画像（軽いので持ち続ける）
const fullCache = new Map();       // id → 表示用の画像（最近使ったぶんだけ）
const FULL_KEEP = 4;
const imgInfo = new Map();         // id → 画像の大きさ { d:表示用 t:一覧用 b:元画像 }
const noteImgInfo = (id, v) =>
  imgInfo.set(id, { d: blobSize(v && v.display), t: blobSize(v && v.thumb), b: blobSize(v && v.blob) });
const hasImage = id => { const i = imgInfo.get(id); return !!i && (i.d > 0 || i.t > 0); };
function forgetImage(id) { thumbCache.delete(id); fullCache.delete(id); }

function blobToDataURL(b) {
  return new Promise(res => {
    if (!blobSize(b)) return res(null);
    const r = new FileReader();
    r.onload = () => {
      const u = typeof r.result === "string" ? r.result : "";
      // 「成功」でも中身が空のことがあるため、長さを確かめる（base64 は元の大きさ以上になる）
      const body = u.length - u.indexOf(",") - 1;
      res(u.startsWith("data:") && body >= b.size ? u : null);
    };
    r.onerror = () => res(null);
    r.readAsDataURL(b);
  });
}

const pickBlob = (rec, kind) => kind === "full"
  ? (rec.display || rec.thumb || rec.blob)
  : (rec.thumb || rec.display || rec.blob);

// 保存領域から読んで文字列にする。新しい保存場所になければ、旧形式の場所も見る
async function readDataURL(id, kind) {
  for (const name of [IMG_STORE, STORE]) {
    let rec = null;
    try { rec = await idbGet(name, id); } catch (e) { console.warn("読み出しに失敗", e); }
    if (!hasBlobs(rec)) continue;
    const url = await blobToDataURL(pickBlob(rec, kind));
    if (url) return url;
  }
  return null;
}

async function imageURL(id, kind, fresh) {
  const cache = kind === "full" ? fullCache : thumbCache;
  if (!fresh && cache.has(id)) {
    const u = cache.get(id);
    if (kind === "full") { cache.delete(id); cache.set(id, u); }   // 使った順に並べ直す
    return u;
  }
  const url = await readDataURL(id, kind);
  if (!url) return null;
  cache.set(id, url);
  while (kind === "full" && cache.size > FULL_KEEP) cache.delete(cache.keys().next().value);
  return url;
}

// 元画像も含めて、保存されているものをそのまま取り出す（作り直し・書き出し用）
async function readImageRec(id) {
  for (const name of [IMG_STORE, STORE]) {
    let rec = null;
    try { rec = await idbGet(name, id); } catch (e) { console.warn("読み出しに失敗", e); }
    if (hasBlobs(rec)) return rec;
  }
  return null;
}

/* ---- 表示の見張り ---- */
// 表示できなかったときは、保存領域から読み直して1回だけやり直す。
// それでもだめなら印を出し、記録タブで確認できるように書き留める
const FAIL_IMG = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">' +
  '<rect width="120" height="120" fill="#E9EBF0"/>' +
  '<text x="60" y="56" font-size="12" text-anchor="middle" fill="#A33A2A">画像を</text>' +
  '<text x="60" y="74" font-size="12" text-anchor="middle" fill="#A33A2A">表示できません</text></svg>');
const imgStat = { shown: 0, recovered: 0, failed: 0 };
const IMGLOG_KEY = "charTrainerImgLog";
function readImgLog() { try { return JSON.parse(localStorage.getItem(IMGLOG_KEY)) || []; } catch (e) { return []; } }
function logImgFail(card, where, why) {
  imgStat.failed++;
  try {
    const a = readImgLog();
    a.unshift({ t: Date.now(), name: card.name, where, why, v: APP_VERSION });
    localStorage.setItem(IMGLOG_KEY, JSON.stringify(a.slice(0, 30)));
  } catch (e) { /* 書き留められなくても表示には関係ない */ }
}
function whereOf(img) {
  if (img.closest("#viewDlg")) return "拡大表示";
  if (img.closest("#editDlg")) return "編集";
  if (img.closest(".choice-img")) return "4択";
  if (img.closest("#panel-study")) return "学習";
  if (img.closest("#panel-memo")) return "覚える";
  if (img.closest("#panel-list")) return "一覧";
  return "その他";
}

let imgSeq = 0;
// img 要素に画像を流し込む。kind が "full" なら大きい方を使う
function setImg(img, card, kind) {
  if (!img || !card) return;
  const tok = ++imgSeq;
  img._tok = tok;
  img.onload = img.onerror = null;
  if (img._cid !== card.id) img.removeAttribute("src");   // 前のキャラの画像を残さない
  img._cid = card.id;
  loadInto(img, card, kind, tok, 1);
}
async function loadInto(img, card, kind, tok, attempt) {
  let url = null;
  try { url = await imageURL(card.id, kind, attempt > 1); } catch (e) { console.warn(e); }
  if (img._tok !== tok || !img.isConnected) return;       // その間に別の表示へ切り替わった
  if (!url) { imgFailed(img, card, kind, tok, attempt, "読み出せない"); return; }
  img.onload = () => {
    if (img._tok !== tok) return;
    if (img.naturalWidth > 0) { imgStat.shown++; if (attempt > 1) imgStat.recovered++; }
    else imgFailed(img, card, kind, tok, attempt, "中身が空");
  };
  img.onerror = () => { if (img._tok === tok) imgFailed(img, card, kind, tok, attempt, "描画できない"); };
  img.style.visibility = "";
  img.src = url;
}
function imgFailed(img, card, kind, tok, attempt, why) {
  img.onload = img.onerror = null;
  forgetImage(card.id);                                   // 手元の写しを捨て、保存領域から読み直す
  if (attempt < 2) { loadInto(img, card, kind, tok, attempt + 1); return; }
  img.style.visibility = "";
  img.src = FAIL_IMG;
  logImgFail(card, whereOf(img), why);
}

// 描画後に、印のついた img へ画像を流し込む
function hydrateImages(root) {
  if (!root) return;
  const byId = new Map(cards.map(c => [c.id, c]));
  root.querySelectorAll("img[data-cid]").forEach(img => {
    const card = byId.get(img.dataset.cid);
    if (card) setImg(img, card, img.dataset.kind);
  });
}

// 一覧用の画像を裏で先に用意しておく（表示を待たせないため）
async function warmThumbs() {
  for (const c of [...cards]) {
    if (thumbCache.has(c.id) || !hasImage(c.id)) continue;
    try { await imageURL(c.id, "thumb"); } catch (e) { /* 表示するときに読み直す */ }
    await new Promise(r => setTimeout(r, 0));
  }
}

/* ---- 画像の複製と縮小 ---- */
// 取り込んだ File はあとから参照できなくなることがあるため、中身を読み出して独立させる
async function toStableBlob(file) {
  try {
    const buf = await file.arrayBuffer();
    return new Blob([buf], { type: file.type || "image/jpeg" });
  } catch (e) { console.warn("複製できませんでした", e); return file; }
}

async function makeThumb(blob, max = 240) {
  try {
    const bmp = await createImageBitmap(blob);
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale));
    const h = Math.max(1, Math.round(bmp.height * scale));
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d");
    ctx.drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();

    // webp を試す。Safari は未対応だと黙って PNG を返すので、種類を確かめる
    const webp = await new Promise(r => cv.toBlob(r, "image/webp", 0.82));
    if (webp && webp.size && webp.type === "image/webp") return webp;

    // 透過があれば PNG、なければ JPEG（PNG は写真だと極端に重くなる）
    let alpha = false;
    try {
      const d = ctx.getImageData(0, 0, w, h).data;
      for (let i = 3; i < d.length; i += 40) { if (d[i] < 250) { alpha = true; break; } }
    } catch (e) { /* 判定できないときは JPEG 扱い */ }

    if (alpha) {
      const png = await new Promise(r => cv.toBlob(r, "image/png"));
      // 透過つき PNG でも大きすぎる場合は、白地の JPEG にする
      if (png && png.size > 600 * 1024) {
        const cv2 = document.createElement("canvas");
        cv2.width = w; cv2.height = h;
        const c2 = cv2.getContext("2d");
        c2.fillStyle = "#ffffff"; c2.fillRect(0, 0, w, h);
        c2.drawImage(cv, 0, 0);
        return await new Promise(r => cv2.toBlob(r, "image/jpeg", 0.82));
      }
      return png;
    }
    return await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
  } catch (e) { console.warn("縮小版を作れませんでした", e); return null; }
}

// 画像が使えないキャラ（登録し直しが必要）
const isLost = c => c.lost || !hasImage(c.id);

// 表示用・一覧用のどちらかが欠けているものを、元になる画像から作り直す。
// 元がなければ「要再登録」と記録する
let converting = false;
async function repairImages(onProgress) {
  if (converting) return { done: 0, failed: 0, errors: [], busy: true };
  const targets = cards.filter(c => { const i = imgInfo.get(c.id); return !i || !(i.d > 0 && i.t > 0); });
  if (!targets.length) return { done: 0, failed: 0, errors: [] };
  converting = true;
  let done = 0, failed = 0; const errors = [];
  try {
    for (const c of targets) {
      try {
        const rec = await readImageRec(c.id);
        let display = rec && blobSize(rec.display) ? rec.display : null;
        let thumb = rec && blobSize(rec.thumb) ? rec.thumb : null;
        const src = rec && (rec.blob || display || thumb);
        if (src && !(display && thumb)) {
          const stable = await toStableBlob(src);
          if (!display) display = await makeThumb(stable, 1000);
          if (!thumb) thumb = await makeThumb(stable, 240);
        }
        if (!display && !thumb) {
          failed++;
          errors.push(`${c.name}：${src ? "画像を読み込めません" : "元画像がありません"}`);
          if (!c.lost) { c.lost = true; await saveCard(c); }
        } else {
          c.lost = false;
          // 表示用と一覧用がそろったので、容量節約のため元画像は手放す
          await writeImage(c, { id: c.id, display: display || thumb, thumb: thumb || display, blob: null });
          done++;
        }
      } catch (e) { failed++; errors.push(`${c.name}：${e && e.name ? e.name : e}`); }
      if (onProgress) onProgress(done + failed, targets.length);
      await new Promise(r => setTimeout(r, 30));   // 操作を妨げないよう間隔を空ける
    }
  } finally { converting = false; }
  return { done, failed, errors };
}

// 起動時に、足りないものがあれば静かに作り直す
async function repairOnStart() {
  const res = await repairImages();
  if (res.busy || (!res.done && !res.failed)) return;
  refreshAll();
  if (res.failed) toast(`${res.failed}体の画像が読み込めません。一覧から登録し直してください`);
  else toast(`${res.done}体の画像を作り直しました`);
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2200);
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
// 全角・半角、大文字・小文字、カタカナ・ひらがなの違いを吸収する
const norm = v => String(v ?? "").normalize("NFKC").toLowerCase()
  .replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
// 空白で区切った語をすべて含むものを探す。「#」で始まる語はタグだけを見る
const matches = (c, q) => {
  if (!q) return true;
  const words = norm(q).split(/\s+/).filter(Boolean);
  const tags = tagsOf(c).map(norm);
  return words.every(w => {
    if (w.startsWith("#")) { const t = w.slice(1); return !t || tags.some(x => x.includes(t)); }
    return norm(c.name).includes(w) || norm(c.group).includes(w) || norm(c.note).includes(w)
        || norm(fld(c)).includes(w) || tags.some(x => x.includes(w));
  });
};

/* ---- タグ ---- */
const tagsOf = c => (c && Array.isArray(c.tags)) ? c.tags : [];
const hasTag = (c, t) => tagsOf(c).includes(t);
const tagCount = t => cards.filter(c => hasTag(c, t)).length;
// いま使われているタグと人数（多い順→名前順）
function allTags() {
  const m = new Map();
  for (const c of cards) for (const t of tagsOf(c)) m.set(t, (m.get(t) || 0) + 1);
  return [...m].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ja"));
}
// 入力をタグに分ける（空白・読点で区切る）。表記ゆれは既存のタグに合わせる
function parseTags(text) {
  const known = new Map();
  for (const [t] of allTags()) known.set(norm(t), t);
  for (const t of tagFolders) if (!known.has(norm(t))) known.set(norm(t), t);
  const out = [];
  for (let s of String(text || "").split(/[\s,、，]+/)) {
    s = s.replace(/^[#＃]+/, "").trim().slice(0, 30);
    if (!s) continue;
    const t = known.get(norm(s)) || s;
    known.set(norm(s), t);
    if (!out.includes(t)) out.push(t);
  }
  return out;
}

// タグに紐づけたフォルダ。そのタグが付いたキャラが自動で入る（コピーはしない）
const TAGF_KEY = "charTrainerTagFolders";
let tagFolders = [];
function loadTagFolders() {
  try {
    const a = JSON.parse(localStorage.getItem(TAGF_KEY));
    tagFolders = Array.isArray(a) ? [...new Set(a.filter(t => typeof t === "string" && t))] : [];
  } catch (e) { tagFolders = []; }
}
function saveTagFolders() {
  try { localStorage.setItem(TAGF_KEY, JSON.stringify(tagFolders)); } catch (e) { /* 保存できなくても動作は続ける */ }
}
// 選んでいるフォルダ・タグフォルダに入っているか（何も選んでいなければすべて）
const inScope = (c, fs, ts) =>
  (fs.size === 0 && ts.size === 0) || fs.has(fld(c)) || tagsOf(c).some(t => ts.has(t));
// フォルダ欄に並べるタグのチップ
const tagChips = isOn => tagFolders.map(t =>
  `<button class="chip tagchip" data-t="${esc(t)}" aria-pressed="${isOn(t)}">#${esc(t)}<span class="n">${tagCount(t)}</span></button>`
).join("");
const folders = () => [...new Set(cards.map(fld))].sort((a, b) =>
  a === UNFILED ? 1 : b === UNFILED ? -1 : a.localeCompare(b, "ja"));
const folderCount = name => cards.filter(c => fld(c) === (name || UNFILED)).length;
const roomIn = name => Math.max(0, FOLDER_MAX - folderCount(name));

/* ============ 取り込み ============ */
function nameFromFile(filename) {
  let n = filename.replace(/\.[^.]+$/, "");
  n = n.replace(/^\d{1,4}[\s_\-.]+/, "");
  n = n.replace(/[_]+/g, " ");
  return n.trim() || filename;
}
function folderFromPath(file) {
  const p = file.webkitRelativePath || "";
  const parts = p.split("/").filter(Boolean);
  return parts.length >= 2 ? parts[parts.length - 2] : "";
}

async function importFiles(files, folderOverride, tags) {
  const imgs = [...files].filter(f => f.type.startsWith("image/"));
  if (!imgs.length) { toast("画像が見つかりませんでした"); return; }
  const counts = new Map(folders().map(f => [f, folderCount(f)]));
  const cnt = f => counts.get(f || UNFILED) ?? 0;
  let added = 0, dupe = 0, overflow = 0, failed = false;
  const fullFolders = new Set();
  for (const f of imgs) {
    const folder = folderOverride !== undefined ? folderOverride : folderFromPath(f);
    const key = folder || UNFILED;
    const name = nameFromFile(f.name);
    if (cards.some(c => c.name === name && fld(c) === key)) { dupe++; continue; }
    if (cnt(folder) >= FOLDER_MAX) { overflow++; fullFolders.add(key); continue; }
    const stable = await toStableBlob(f);
    const display = await makeThumb(stable, 1000);
    const thumb = await makeThumb(stable, 240);
    const rec = { id: crypto.randomUUID(), name, folder: folder || "", group: "", note: "",
                  tags: tags ? [...tags] : [], level: 0, due: today(), ok: 0, ng: 0, seen: 0 };
    // 表示用と一覧用を作れたときは、容量節約のため元画像は保存しない
    const img = { id: rec.id, display, thumb, blob: (display && thumb) ? null : stable };
    try { await addCard(metaOf(rec), img); cards.push(rec); counts.set(key, cnt(folder) + 1); added++; }
    catch (e) { console.error(e); failed = true; break; }
  }
  refreshAll();
  if (failed) { toast("保存できませんでした。端末の空き容量を確認してください"); return; }
  const notes = [];
  if (dupe) notes.push(`同名${dupe}体は除外`);
  if (overflow) notes.push(`${[...fullFolders].join("・")}が上限${FOLDER_MAX}体のため${overflow}体は未登録`);
  toast(`${added}体を追加しました${notes.length ? `（${notes.join("／")}）` : ""}`);
}

/* ============ 出題 ============ */
// いまの絞り込みに合うキャラ
function pool() {
  const g = document.getElementById("setGroup").value;
  const scope = document.getElementById("setScope").value;
  let p = cards.filter(c => inScope(c, studyFolders, studyTags));
  if (g) p = p.filter(c => c.group === g);
  if (scope === "weak") p = p.filter(c => c.ng > 0 && c.ng >= c.ok);
  return p;
}
// 1回ぶんの出題を、重複なしで組み立てる
let queue = [], qPos = 0, qOk = 0, qNg = 0;
function startSession() {
  const shuffled = pool().map(c => [Math.random(), c]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
  const n = document.getElementById("setCount").value;
  const size = n === "all" ? shuffled.length : Math.min(Number(n), shuffled.length);
  queue = shuffled.slice(0, size).map(c => c.id);
  qPos = 0; qOk = 0; qNg = 0;
}
function currentCard() {
  while (qPos < queue.length) {
    const c = cards.find(x => x.id === queue[qPos]);
    if (c) return c;
    queue.splice(qPos, 1);      // 途中で削除されたキャラは飛ばす
  }
  return null;
}
function distractors(card, n) {
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
  const scope = cards.filter(c => c.id !== card.id && !isLost(c) && inScope(c, studyFolders, studyTags));
  const sameGroup = scope.filter(c => card.group && c.group === card.group);
  const sameFolder = scope.filter(c => !(card.group && c.group === card.group) && fld(c) === fld(card));
  const rest = scope.filter(c => !sameGroup.includes(c) && !sameFolder.includes(c));
  return [...shuffle(sameGroup), ...shuffle(sameFolder), ...shuffle(rest)].slice(0, n);
}
let grading = false, saveWarned = false;
async function grade(good) {
  if (grading || !current) return;        // 連打による二重処理を防ぐ
  grading = true;
  document.querySelectorAll(".grade button, .choice").forEach(b => b.disabled = true);
  try {
    const c = current;
    c.seen++;
    if (good) { c.ok++; c.level = Math.min(c.level + 1, 5); qOk++; }
    else { c.ng++; c.level = 0; qNg++; }
    try { await saveCard(c); }
    catch (e) {                            // 保存できなくても学習は続けられるようにする
      console.error("保存に失敗", e);
      if (!saveWarned) {
        saveWarned = true;
        toast("記録を保存できません。端末の空き容量を確認してください");
      }
    }
    qPos++;
  } finally {
    grading = false;                       // 何が起きても必ず解除する
    renderStudy(); updateHead();
  }
}

    tagChips(t => studyTags.has(t));

    else if (!f) { studyFolders.clear(); studyTags.clear(); }
    else { studyFolders.has(f) ? studyFolders.delete(f) : studyFolders.add(f); }
    updateGroupSelect();          // 先にグループ欄を作り直してから組み立てる
    startSession();
    renderStudyFolders(); renderStudy();

function releaseImages(el) {
  if (el) el.querySelectorAll("img").forEach(img => {
    img._tok = 0; img.onload = img.onerror = null; img.removeAttribute("src");
  });
}
function renderStudy() {
  const stage = document.getElementById("stage");
  releaseImages(stage);                 // 前の問題の画像を先に解放する
  if (!cards.length) {
    stage.innerHTML = `<div class="empty"><h2>まだキャラクターがいません</h2>
      <p>「一覧」タブから画像を追加してください。ファイル名がそのまま名前になります。</p>
      <button class="btn primary" id="goList">画像を追加する</button></div>`;
    document.getElementById("goList").onclick = () => document.querySelector("[data-tab=list]").click();
    return;
  }
  if (!queue.length) startSession();
  current = currentCard();
  if (!current && !queue.length && pool().length) startSession();   // 消えたキャラで空になった場合は組み直す
  if (!current) current = currentCard();
  if (!queue.length) {
    stage.innerHTML = `<div class="empty"><h2>該当するキャラがいません</h2>
      <p>フォルダやグループの絞り込みを見直してください。</p></div>`;
    return;
  }
  if (!current) {                     // 全問終了
    const total = qOk + qNg;
    const rate = total ? Math.round(qOk / total * 100) : 0;
    stage.innerHTML = `<div class="empty">
      <h2>${total}問おつかれさまでした</h2>
      <p>正解 ${qOk}・不正解 ${qNg}（正答率 ${rate}%）</p>
      <button class="btn primary wide" id="againBtn">別の問題でもう一度</button></div>`;
    document.getElementById("againBtn").onclick = () => { startSession(); renderStudy(); };
    return;
  }
  const mode = document.getElementById("setMode").value;

  stage.innerHTML = `
    <div class="meta-row">

      <span class="pill">${esc(fld(c))}</span>
      <span>正 ${c.ok}・誤 ${c.ng}</span>
      <span style="margin-left:auto">${qPos + 1} / ${queue.length}問</span></div>
    ${promptHtml}<div id="interact"></div>`;
  hydrateImages(stage);
  const box = document.getElementById("interact");
  mode === "choice4" ? renderChoices(box, c, dir) : renderRecall(box, c, dir);
}
function renderRecall(box, c, dir) {
  box.innerHTML = `<div class="answer-slot"><button class="reveal-btn" id="revealBtn">タップして答えを見る</button></div>`;
  document.getElementById("revealBtn").onclick = () => {

      : `<div class="imgwrap"><img data-cid="${c.id}" data-kind="full" alt="" decoding="async"></div>`;

    hydrateImages(box);

function renderChoices(box, c, dir) {
  const opts = [c, ...distractors(c, 3)].map(v => [Math.random(), v])
    .sort((a, b) => a[0] - b[0]).map(v => v[1]);

// タグの名前をすべてのキャラで変える（同じ名前のタグがあれば1つにまとめる）
async function renameTag(from, input) {
  const to = String(input || "").replace(/^[#＃]+/, "").trim().slice(0, 30);
  if (!to || to === from) return;
  if (/[\s,、，]/.test(to)) { toast("タグの名前に空白や読点は使えません"); return; }
  const targets = cards.filter(c => hasTag(c, from));
  targets.forEach(c => { c.tags = [...new Set(tagsOf(c).map(t => t === from ? to : t))]; });
  try { await saveCards(targets); }
  catch (e) { console.error(e); toast("保存できませんでした"); return; }
  tagFolders = [...new Set(tagFolders.map(t => t === from ? to : t))];
  saveTagFolders();
  for (const s of [studyTags, memoTags]) if (s.has(from)) { s.delete(from); s.add(to); }
  if (listTag === from) listTag = to;
  refreshAll(); toast(`${targets.length}体のタグを #${to} に変えました`);
}

  const stable = await toStableBlob(file);

  card.lost = false;
  await writeImage(card, { id: card.id, display: display || thumb, thumb: thumb || display, blob: null });
  return true;
}

/* ============ 保存状態の診断と修復 ============ */
function storageReport() {
  let stored = 0, refOnly = 0, none = 0, bytes = 0;
  for (const c of cards) {
    const i = imgInfo.get(c.id) || { d: 0, t: 0, b: 0 };
    bytes += i.d + i.t + i.b;
    if (i.d > 0 || i.t > 0) stored++;
    else if (i.b > 0) refOnly++;
    else none++;
  }
  return { stored, refOnly, none, bytes, oldStyle: oldStyle.size };
}
const isHeavy = c => { const i = imgInfo.get(c.id); return !!i && (i.d > 300 * 1024 || i.t > 60 * 1024); };

// 保存済みの画像を圧縮し直して軽くする
async function optimizeAll(onProgress) {
  if (converting) return { done: 0, saved: 0, busy: true };
  converting = true;
  const targets = cards.filter(isHeavy);
  let done = 0, saved = 0;
  try {
    for (const c of targets) {
      try {
        const rec = await readImageRec(c.id);
        const src = rec && (rec.display || rec.thumb || rec.blob);
        if (src) {
          const before = blobSize(rec.display) + blobSize(rec.thumb);
          const display = await makeThumb(src, 1000);
          const thumb = await makeThumb(src, 240);
          if (display && thumb) {
            await writeImage(c, { id: c.id, display, thumb, blob: null });
            saved += before - (blobSize(display) + blobSize(thumb));
            done++;
          }
        }
      } catch (e) { console.warn(e); }
      if (onProgress) onProgress(done, targets.length);
      await new Promise(r => setTimeout(r, 0));
    }
  } finally { converting = false; }
  return { done, saved };
}

/* ============ バックアップ ============ */
const BACKUP_SIG = "character-name-trainer";

function dataURLToBlob(u) {
  if (!u || typeof u !== "string" || !u.startsWith("data:")) return null;
  try {
    const [head, b64] = u.split(",");
    const type = (head.match(/data:([^;]+)/) || [, "image/jpeg"])[1];
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type });
  } catch (e) { console.warn("復元できない画像がありました", e); return null; }
}

// 画像ごと1つのファイルに書き出す（巨大な文字列を作らないよう分割して組み立てる）
// 画像は手元の写しではなく、保存領域から読み直す
async function exportBackup(onProgress) {
  const parts = [`{"app":"${BACKUP_SIG}","version":1,"exportedAt":"${new Date().toISOString()}",` +
                 `"tagFolders":${JSON.stringify(tagFolders)},"cards":[`];
  const missing = [];
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    const display = await readDataURL(c.id, "full");
    const thumb = await readDataURL(c.id, "thumb");
    if (!display && !thumb) missing.push(c.name);
    const rec = {
      name: c.name, folder: c.folder || "", group: c.group || "", note: c.note || "",
      tags: tagsOf(c), level: c.level, ok: c.ok, ng: c.ng, seen: c.seen, due: c.due,
      display, thumb
    };
    parts.push((i ? "," : "") + JSON.stringify(rec));
    if (onProgress) onProgress(i + 1, cards.length);
    await new Promise(r => setTimeout(r, 0));
  }
  parts.push("]}");
  return { blob: new Blob(parts, { type: "application/json" }), missing };
}

// バックアップから復元する。mode: "merge" は追加、"replace" は総入れ替え
async function importBackup(text, mode, onProgress) {
  let data;
  try { data = JSON.parse(text); }
  catch (e) { return { error: "ファイルを読み取れませんでした" }; }
  if (!data || data.app !== BACKUP_SIG || !Array.isArray(data.cards))
    return { error: "このアプリのバックアップではないようです" };

  if (mode === "replace") {
    await txDone([STORE, IMG_STORE], "readwrite", t => {
      t.objectStore(STORE).clear(); t.objectStore(IMG_STORE).clear();
    });
    cards = []; imgInfo.clear(); oldStyle.clear(); thumbCache.clear(); fullCache.clear();
  }
  let added = 0, dupe = 0, over = 0, bad = 0;
  const counts = new Map(folders().map(f => [f, folderCount(f)]));
  const cnt = f => counts.get(f || UNFILED) ?? 0;

  for (let i = 0; i < data.cards.length; i++) {
    const r = data.cards[i];
    const key = r.folder || UNFILED;
    if (cards.some(c => c.name === r.name && fld(c) === key)) { dupe++; }
    else if (cnt(r.folder) >= FOLDER_MAX) { over++; }
    else {
      const display = dataURLToBlob(r.display), thumb = dataURLToBlob(r.thumb);
      if (!display && !thumb) { bad++; }
      else {
        const rec = {
          id: crypto.randomUUID(), name: r.name || "(名称未設定)",
          folder: r.folder || "", group: r.group || "", note: r.note || "",
          tags: cleanTags(r.tags),
          level: r.level || 0, ok: r.ok || 0, ng: r.ng || 0, seen: r.seen || 0,
          due: r.due || today()
        };
        const img = { id: rec.id, display: display || thumb, thumb: thumb || display, blob: null };
        try { await addCard(metaOf(rec), img); cards.push(rec); counts.set(key, cnt(r.folder) + 1); added++; }
        catch (e) { return { error: "保存できませんでした。空き容量を確認してください", added }; }
      }
    }
    if (onProgress) onProgress(i + 1, data.cards.length);
    await new Promise(r => setTimeout(r, 0));
  }
  // タグフォルダ：総入れ替えならバックアップのとおりに、追加なら今のものに足す
  const tf = cleanTags(data.tagFolders);
  tagFolders = mode === "replace" ? tf : [...new Set([...tagFolders, ...tf])];
  saveTagFolders();
  return { added, dupe, over, bad };
}
// 読み込んだタグの形を整える（古いバックアップには無い）
const cleanTags = a => Array.isArray(a)
  ? [...new Set(a.filter(t => typeof t === "string")
      .map(t => t.replace(/^[#＃]+/, "").trim().slice(0, 30)).filter(Boolean))]
  : [];

/* ============ 記録 ============ */
function renderStats() {
  const body = document.getElementById("statsBody");
  if (!cards.length) { body.innerHTML = `<div class="empty"><p>学習を始めると、ここに記録が並びます。</p></div>`; return; }
  const learned = cards.filter(c => c.level >= 3).length;
  const untouched = cards.filter(c => c.seen === 0).length;
  const ok = cards.reduce((s, c) => s + c.ok, 0), ng = cards.reduce((s, c) => s + c.ng, 0);
  const rate = ok + ng ? Math.round(ok / (ok + ng) * 100) : 0;
  const weak = cards.filter(c => c.ng > 0).sort((a, b) =>
    (b.ng / Math.max(b.ok + b.ng, 1)) - (a.ng / Math.max(a.ok + a.ng, 1)) || b.ng - a.ng).slice(0, 20);

  body.innerHTML = `
    <div class="statgrid">
      <div class="card stat"><b>${cards.length}</b><span>登録数</span></div>
      <div class="card stat"><b>${learned}</b><span>定着（Lv3以上）</span></div>
      <div class="card stat"><b>${untouched}</b><span>未学習</span></div>
      <div class="card stat"><b>${weak.length}</b><span>苦手</span></div>
      <div class="card stat"><b>${rate}%</b><span>通算正答率</span></div>
    </div>
    <h3>フォルダごとの状況</h3>
    <div class="card" style="padding:4px 12px"><table>
      <thead><tr><th>フォルダ</th><th class="num">数</th><th class="num">定着</th><th class="num">正答率</th></tr></thead>
      <tbody>${[...folders().map(f => [f, cards.filter(c => fld(c) === f)]),
                ...tagFolders.map(t => ["#" + t, cards.filter(c => hasTag(c, t))])].map(([label, g]) => {
        const o = g.reduce((s, c) => s + c.ok, 0), x = g.reduce((s, c) => s + c.ng, 0);
        return `<tr><td>${esc(label)}</td><td class="num">${g.length}</td>
          <td class="num">${g.filter(c => c.level >= 3).length}</td>
          <td class="num">${o + x ? Math.round(o / (o + x) * 100) + "%" : "—"}</td></tr>`;
      }).join("")}</tbody></table></div>
    ${weak.length ? `<h3>間違えやすいキャラ</h3>
    <div class="card" style="padding:4px 12px"><table>
      <thead><tr><th>名前</th><th>フォルダ</th><th class="num">正</th><th class="num">誤</th></tr></thead>
      <tbody>${weak.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(fld(c))}</td>
        <td class="num">${c.ok}</td><td class="num">${c.ng}</td></tr>`).join("")}</tbody></table></div>` : ""}
    <h3>画像の保存状態　<span style="font-weight:400;color:var(--muted);font-size:13px">バージョン ${APP_VERSION}</span></h3>
    <div class="card" style="padding:14px">
      <div id="diagLine" style="font-size:14px"></div>
      <div id="convProgress" class="hint" style="margin-top:6px"></div>
      <button class="btn wide" style="margin-top:10px" id="convBtn">画像を端末内に保存し直す</button>
      <button class="btn wide" style="margin-top:8px" id="optBtn">画像を軽くする</button>
    </div>
    <h3>画像の表示チェック</h3>
    <div class="card" style="padding:14px">
      <div id="imgCheckLine" style="font-size:14px"></div>
      <div id="imgLogList" class="hint" style="margin-top:8px"></div>
      <div id="imgLogTools"></div>
    </div>
    <h3>バックアップ</h3>
    <div class="card" style="padding:14px">
      <div style="font-size:14px;color:var(--muted);margin-bottom:10px">
        画像・名前・学習記録をまとめて1つのファイルに保存します。
        機種変更や、データが消えたときの復元に使えます。
      </div>
      <button class="btn wide primary" id="bkExport">バックアップを書き出す</button>
      <label class="btn wide filebtn" style="margin-top:8px">バックアップから復元する
        <input type="file" id="bkImport" accept=".json,application/json"></label>
      <div id="bkProgress" class="hint" style="margin-top:6px"></div>
    </div>

    <div class="hint" id="storageLine">iPhoneでは、共有ボタンから「ホーム画面に追加」しておくと
      データが消えにくくなります。</div>
    <button class="btn danger wide" style="margin-top:14px" id="resetBtn">学習記録だけをリセット</button>`;

  // 保存状態の診断
  (function paintDiag() {
    const r = storageReport();
    const mb = n => (n / 1048576).toFixed(1) + "MB";
    document.getElementById("diagLine").innerHTML =
      `端末内に保存済み：<b>${r.stored}体</b><br>` +
      `元ファイル参照のまま：<b style="color:var(--ng)">${r.refOnly}体</b>` +
      (r.refOnly ? "（表示できなくなることがあります）" : "") + `<br>` +
      `画像なし：<b>${r.none}体</b><br>` +
      `画像データの実測：${mb(r.bytes)}` +
      (cards.length ? `（1体あたり ${(r.bytes / cards.length / 1024).toFixed(0)}KB）` : "");
    if (r.oldStyle) {
      document.getElementById("diagLine").insertAdjacentHTML("beforeend",
        `<br>保存の形式：新しい形式 <b>${cards.length - r.oldStyle}体</b>` +
        `／旧形式のまま <b style="color:var(--ng)">${r.oldStyle}体</b>`);
    }
    const btn = document.getElementById("convBtn");
    btn.disabled = r.refOnly === 0;
    btn.textContent = r.refOnly ? `${r.refOnly}体を端末内に保存し直す` : "すべて端末内に保存済みです";
  })();

  // 画像がきちんと表示できているかの記録（不具合を切り分けるための手がかり）
  (function paintImgCheck() {
    const log = readImgLog();
    document.getElementById("imgCheckLine").innerHTML =
      `この起動から：表示 <b>${imgStat.shown}</b>回` +
      `／読み直して回復 <b>${imgStat.recovered}</b>回` +
      `／表示できず <b style="color:${imgStat.failed ? "var(--ng)" : "inherit"}">${imgStat.failed}</b>回`;
    const fmt = t => {
      const d = new Date(t);
      return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    };
    document.getElementById("imgLogList").innerHTML = log.length
      ? "最近の失敗（新しい順）<br>" + log.slice(0, 10).map(e =>
          `${fmt(e.t)}　${esc(e.name)}（${esc(e.where)}・${esc(e.why)}・${esc(e.v)}）`).join("<br>")
      : "表示できなかった記録はありません。";
    document.getElementById("imgLogTools").innerHTML = log.length
      ? `<button class="btn sm wide" style="margin-top:10px" id="imgLogClear">この記録を消す</button>` : "";
    const cl = document.getElementById("imgLogClear");
    if (cl) cl.onclick = () => {
      try { localStorage.removeItem(IMGLOG_KEY); } catch (e) { /* 消せなくても支障はない */ }
      renderStats();
    };
  })();

  (function paintOpt() {
    const heavy = cards.filter(isHeavy);
    const btn = document.getElementById("optBtn");
    btn.disabled = heavy.length === 0;
    btn.textContent = heavy.length ? `${heavy.length}体の画像を軽くする` : "画像は十分に軽い状態です";
    if (heavy.length) btn.classList.add("primary"); else btn.classList.remove("primary");
  })();

  document.getElementById("optBtn").onclick = async () => {
    const prog = document.getElementById("convProgress");
    document.getElementById("optBtn").disabled = true;
    const res = await optimizeAll((i, n) => { prog.textContent = `作り直し中… ${i} / ${n}`; });
    prog.textContent = "";
    refreshAll(); renderStats();
    toast(`${res.done}体を作り直し、${(res.saved / 1048576).toFixed(1)}MB 減りました`);
  };

  document.getElementById("convBtn").onclick = async () => {
    const prog = document.getElementById("convProgress");
    document.getElementById("convBtn").disabled = true;
    const res = await repairImages((i, n) => { prog.textContent = `変換中… ${i} / ${n}`; });
    prog.textContent = "";
    refreshAll(); renderStats();
    if (res.failed) {
      alert(`${res.done}体を保存し直しました。\n${res.failed}体は失敗しました：\n\n` +
            res.errors.slice(0, 10).join("\n"));
    } else {
      toast(`${res.done}体を端末内に保存し直しました`);
    }
  };

  // バックアップ
  document.getElementById("bkExport").onclick = async () => {
    if (!cards.length) { toast("まだ登録がありません"); return; }
    const prog = document.getElementById("bkProgress");
    const btn = document.getElementById("bkExport");
    btn.disabled = true;
    try {
      const { blob, missing } = await exportBackup((i, n) => { prog.textContent = `書き出し中… ${i} / ${n}`; });
      const d = new Date();
      const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `キャラクター名前トレーナー_${stamp}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      prog.textContent = `${cards.length}体・${(blob.size / 1048576).toFixed(1)}MB を書き出しました`;
      if (missing.length) {
        alert(`${missing.length}体の画像を書き出せませんでした：\n\n` + missing.slice(0, 10).join("、") +
              "\n\n記録タブの「画像の保存状態」を確認してください。");
      }
    } catch (e) {
      console.error(e); prog.textContent = "書き出しに失敗しました";
    }
    btn.disabled = false;
  };

  document.getElementById("bkImport").onchange = async e => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    const mode = cards.length === 0 ? "replace"
      : confirm(`いま${cards.length}体が登録されています。\n\n［OK］今のデータを消して入れ替える\n［キャンセル］今のデータに追加する`)
        ? "replace" : "merge";
    if (mode === "replace" && cards.length &&
        !confirm("今のデータをすべて消してから復元します。本当によろしいですか。")) return;

    const prog = document.getElementById("bkProgress");
    prog.textContent = "ファイルを読み込み中…";
    const text = await file.text();
    const res = await importBackup(text, mode, (i, n) => { prog.textContent = `復元中… ${i} / ${n}`; });
    prog.textContent = "";
    refreshAll(); renderStats();
    if (res.error) { alert(res.error); return; }
    const notes = [];
    if (res.dupe) notes.push(`同名${res.dupe}体は除外`);
    if (res.over) notes.push(`上限超過${res.over}体は未登録`);
    if (res.bad) notes.push(`画像なし${res.bad}体は除外`);
    alert(`${res.added}体を復元しました${notes.length ? `\n（${notes.join("／")}）` : ""}`);
  };

  // 保存容量の状況を表示する
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(({ usage, quota }) => {
      const line = document.getElementById("storageLine");
      if (!line || !usage) return;
      const mb = n => (n / 1048576).toFixed(1) + "MB";
      line.insertAdjacentHTML("afterbegin",
        `使用中の容量：${mb(usage)}${quota ? ` ／ 上限 ${mb(quota)}` : ""}<br>`);
    }).catch(() => {});
  }

  document.getElementById("resetBtn").onclick = async () => {
    if (!confirm("正誤とレベルをすべて0に戻します。画像・名前・フォルダは残ります。")) return;
    cards.forEach(c => { c.level = 0; c.ok = 0; c.ng = 0; c.seen = 0; c.due = today(); });
    await saveCards(cards);
    startSession(); refreshAll(); toast("記録をリセットしました");
  };
}

/* ============ 書き出し ============ */
document.getElementById("exportBtn").onclick = () => {
  if (!cards.length) { toast("まだ登録がありません"); return; }
  const rows = [["フォルダ", "名前", "グループ", "タグ", "手がかり", "レベル", "正", "誤"],
    ...cards.map(c => [fld(c), c.name, c.group, tagsOf(c).map(t => "#" + t).join(" "), c.note, c.level, c.ok, c.ng])];
  const csv = "\uFEFF" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "キャラクター一覧.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("CSVを書き出しました");
};

/* ============ 共通 ============ */
function updateGroupSelect() {
  const sel = document.getElementById("setGroup"), keep = sel.value;
  const scoped = cards.filter(c => inScope(c, studyFolders, studyTags));
  const gs = [...new Set(scoped.map(c => c.group).filter(Boolean))].sort();
  sel.innerHTML = `<option value="">グループ：すべて</option>` +
    gs.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join("");
  sel.value = gs.includes(keep) ? keep : "";
  sel.hidden = gs.length === 0;
}
function updateHead() {
  const fresh = cards.filter(c => c.seen === 0).length;
  document.getElementById("headCount").textContent =
    cards.length ? `${cards.length}体${fresh ? `・未学習 ${fresh}` : ""}` : "";
}
function refreshAll() {
  // 消えたフォルダを選択状態から外す
  const exist = new Set(folders());
  [...studyFolders].forEach(f => { if (!exist.has(f)) studyFolders.delete(f); });
  [...memoFolders].forEach(f => { if (!exist.has(f)) memoFolders.delete(f); });
  if (listFolder !== null && !exist.has(listFolder)) listFolder = null;
  const linked = new Set(tagFolders);
  [...studyTags].forEach(t => { if (!linked.has(t)) studyTags.delete(t); });
  [...memoTags].forEach(t => { if (!linked.has(t)) memoTags.delete(t); });
  if (listTag !== null && !linked.has(listTag)) listTag = null;
  updateGroupSelect(); updateHead();
  renderStudyFolders(); renderStudy();
  renderListFolders(); renderList(); updateActionBar();
  renderMemoFolders(); renderMemo();
  if (document.getElementById("panel-stats").classList.contains("active")) renderStats();
}

document.querySelectorAll("nav button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b === btn));
    document.querySelectorAll(".panel").forEach(p => {
      const on = p.id === "panel-" + btn.dataset.tab;
      if (!on && p.classList.contains("active")) releaseImages(p);   // 離れるタブの画像を解放
      p.classList.toggle("active", on);
    });
    if (btn.dataset.tab !== "list" && selecting) setSelecting(false);
    if (btn.dataset.tab === "study") {
      if (queue.length && !currentCard()) startSession();   // 前回が終わっていれば新しい回を
      renderStudy();                                        // 画像を解放しているので必ず描き直す
    }
    if (btn.dataset.tab === "memo") { renderMemoFolders(); renderMemo(); }
    if (btn.dataset.tab === "stats") renderStats();
    if (btn.dataset.tab === "list") { renderListFolders(); renderList(); }
  };
});
/* 設定の記憶（使えない環境では黙って無視する） */
const PREF_KEY = "charTrainerPrefs";
function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { return {}; }
}
function savePrefs() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({
      mode: document.getElementById("setMode").dataset.value,
      dir: document.getElementById("setDir").dataset.value,
      scope: document.getElementById("setScope").dataset.value,
      count: document.getElementById("setCount").dataset.value,
      memoName: document.getElementById("memoName").dataset.value
    }));
  } catch (e) { /* 保存できなくても動作に支障はない */ }
}

function paintSeg(el) {
  el.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.v === el.dataset.value)));
}
(() => {
  const pf = loadPrefs();
  const map = { setMode: pf.mode, setDir: pf.dir, setScope: pf.scope, setCount: pf.count };
  ["setMode", "setDir", "setScope", "setCount"].forEach(id => {
    const el = document.getElementById(id);
    const saved = map[id];
    // 保存された値が今も選択肢にあるときだけ復元する
    if (saved && [...el.querySelectorAll("button")].some(b => b.dataset.v === saved)) {
      el.dataset.value = saved;
    }
    Object.defineProperty(el, "value", { get: () => el.dataset.value });
    el.querySelectorAll("button").forEach(b => b.onclick = () => {
      el.dataset.value = b.dataset.v;
      paintSeg(el); savePrefs();
      if (id === "setScope" || id === "setCount") startSession();
      renderStudy();
    });
    paintSeg(el);
  });
})();
(() => {
  const el = document.getElementById("memoName");
  const saved = loadPrefs().memoName;
  if (saved === "show" || saved === "hide") el.dataset.value = saved;
  Object.defineProperty(el, "value", { get: () => el.dataset.value });
  el.querySelectorAll("button").forEach(b => b.onclick = () => {
    el.dataset.value = b.dataset.v; paintSeg(el); savePrefs(); renderMemo();
  });
  paintSeg(el);
})();
document.getElementById("setGroup").addEventListener("change", () => { startSession(); renderStudy(); });
document.getElementById("listSearch").addEventListener("input", renderList);
document.getElementById("memoSearch").addEventListener("input", renderMemo);

/* ============ 画面の拡大を抑える ============ */
// Safari のピンチ操作
["gesturestart", "gesturechange", "gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
// 2本指でのつまみ操作
document.addEventListener("touchmove", e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

window.addEventListener("unhandledrejection", e => {
  console.error("未処理のエラー", e.reason);
  grading = false;                       // 固まったままにしない
});

(async function init() {
  try { db = await openDB(); }
  catch (e) {
    console.error(e);
    document.querySelector("main").innerHTML =
      `<div class="empty"><h2>保存領域を開けませんでした</h2>
       <p>プライベートブラウズを解除するか、別のブラウザでお試しください。</p></div>`;
    return;
  }
  let moved = 0;
  try { moved = (await migrateImages()).moved; }
  catch (e) { console.warn("画像の移行は見送りました", e); }   // 旧形式のままでも表示できる
  try {
    (await idbAll(IMG_STORE)).forEach(v => noteImgInfo(v.id, v));
    const recs = await idbAll(STORE);
    for (const r of recs) {
      if (hasBlobs(r)) {                       // 移行できずに旧形式のまま残っているもの
        oldStyle.add(r.id);
        if (!hasImage(r.id)) noteImgInfo(r.id, r);
      }
      delete r.display; delete r.thumb; delete r.blob;   // 画像の参照は手元に持たない
    }
    cards = recs;
  } catch (e) {
    console.error(e);
    document.querySelector("main").innerHTML =
      `<div class="empty"><h2>データを読み込めませんでした</h2>
       <p>ページを再読み込みしてもだめな場合は、バックアップから復元してください。</p></div>`;
    return;
  }
  cards.forEach(c => {
    c.folder ??= ""; c.group ??= ""; c.note ??= "";
    if (!Array.isArray(c.tags)) c.tags = [];
    c.level ??= 0; c.ok ??= 0; c.ng ??= 0; c.seen ??= 0; c.due ??= today();
  });
  loadTagFolders();
  refreshAll();
  if (moved) toast(`画像の保存方法を新しくしました（${moved}体）`);
  warmThumbs();
  repairOnStart();
})();
</script>
