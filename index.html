<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>キャラクター名前トレーナー</title>
<style>
  :root {
    --bg: #F3F4F7; --surface: #FFFFFF; --surface-2: #E9EBF0; --line: #D3D7E0;
    --text: #1A1D24; --muted: #666E7E; --accent: #4F5BD5;
    --ok: #1F7A4D; --ok-bg: #DFF3E7; --ng: #A33A2A; --ng-bg: #FBE4DF;
    --shadow: 0 1px 3px rgba(20,24,35,.10), 0 6px 20px rgba(20,24,35,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161B; --surface: #1E212A; --surface-2: #272B36; --line: #343A48;
      --text: #E9EBF0; --muted: #98A0B0; --accent: #8B95F5;
      --ok: #6FD59B; --ok-bg: #1B3227; --ng: #F0907C; --ng-bg: #33201C;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161B; --surface: #1E212A; --surface-2: #272B36; --line: #343A48;
    --text: #E9EBF0; --muted: #98A0B0; --accent: #8B95F5;
    --ok: #6FD59B; --ok-bg: #1B3227; --ng: #F0907C; --ng-bg: #33201C;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.6;
    display: flex; flex-direction: column; overscroll-behavior-y: contain;
  }
  header {
    padding: max(12px, env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--line); background: var(--surface);
    display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  header .count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 24px; }
  .panel { display: none; }
  .panel.active { display: block; }

  nav {
    display: flex; border-top: 1px solid var(--line); background: var(--surface);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 11px 4px 13px; font: inherit; font-size: 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border-top: 2px solid transparent; margin-top: -1px;
  }
  nav button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  nav button[aria-selected="true"] { color: var(--accent); border-top-color: var(--accent); }

  button, select, input, textarea { font: inherit; color: inherit; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 11px 16px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; font-weight: 500; transition: transform .06s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.wide { width: 100%; }
  .btn.sm { padding: 8px 12px; font-size: 14px; }
  .btn:focus-visible, select:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* chips */
  .chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
  .chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .chip .n { opacity: .7; font-size: 12px; margin-left: 5px; font-variant-numeric: tabular-nums; }

  #stage { display: flex; flex-direction: column; gap: 14px; }
  .imgwrap {
    position: relative; width: 100%; aspect-ratio: 1/1; max-height: 44vh;
    border-radius: var(--radius); overflow: hidden; background: var(--surface-2);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  }
  .imgwrap img { width: 100%; height: 100%; object-fit: contain; }
  .prompt-name { font-size: 30px; font-weight: 600; text-align: center; padding: 34px 16px; letter-spacing: .02em; }
  .answer-slot { min-height: 62px; display: flex; align-items: center; justify-content: center; }
  .reveal-btn {
    width: 100%; padding: 17px; border-radius: 12px; border: 1px dashed var(--line);
    background: var(--surface-2); color: var(--muted); cursor: pointer;
  }
  .answer-name { font-size: 28px; font-weight: 600; text-align: center; letter-spacing: .02em; animation: rise .22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .answer-name { animation: none; } }
  .answer-note { font-size: 14px; color: var(--muted); text-align: center; margin-top: 2px; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .choice {
    padding: 15px 10px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; text-align: center; font-size: 16px;
    min-height: 58px; word-break: break-word;
  }
  .choice.correct { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .choice.wrong { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); }
  .choice-img { padding: 6px; aspect-ratio: 1/1; }
  .choice-img img { width: 100%; height: 100%; object-fit: contain; }

  .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .grade .again { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); }
  .grade .good { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .grade button { padding: 15px; font-weight: 600; }

  .meta-row { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .pill { padding: 3px 9px; border-radius: 99px; background: var(--surface-2); font-size: 12px; }
  .settings { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .settings select {
    padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .tile { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; }
  .tile .th { aspect-ratio: 1/1; background: var(--surface-2); display: flex; }
  .tile .th img { width: 100%; height: 100%; object-fit: contain; }
  .tile .nm { padding: 7px 8px 8px; font-size: 13px; line-height: 1.35; word-break: break-word; }
  .tile .lv { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .tick {
    position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface); border: 1.5px solid var(--line); display: none;
    align-items: center; justify-content: center; font-size: 14px; color: #fff;
  }
  body.selecting .tick { display: flex; }
  .tile[aria-checked="true"] .tick { background: var(--accent); border-color: var(--accent); }

  .actionbar {
    position: sticky; bottom: 0; margin: 12px -16px -24px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 8px; z-index: 10;
  }
  .actionbar .btn { flex: 1; }

  .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px,1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { padding: 14px; }
  .stat b { display: block; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { font-weight: 500; color: var(--muted); font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  h3 { font-size: 15px; margin: 18px 0 6px; font-weight: 600; }

  dialog {
    border: none; border-radius: 16px; padding: 0; background: var(--surface); color: var(--text);
    width: min(440px, calc(100vw - 32px)); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg-body { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .dlg-body img { width: 130px; height: 130px; object-fit: contain; align-self: center; background: var(--surface-2); border-radius: 12px; }
  .dlg-body h2 { margin: 0; font-size: 17px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=text], textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
  }
  textarea { resize: vertical; min-height: 58px; }
  .dlg-actions { display: flex; gap: 8px; }
  .dlg-actions .btn { flex: 1; }
  .danger { color: var(--ng); }

  .empty { text-align: center; padding: 38px 16px; color: var(--muted); }
  .empty h2 { color: var(--text); font-size: 19px; margin: 0 0 8px; }
  .empty p { margin: 0 auto 18px; max-width: 34ch; font-size: 14px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .hint code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(76px + env(safe-area-inset-bottom)); background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 99px; font-size: 14px; z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .filebtn input { display: none; }
</style>
</head>
<body>

<header>
  <h1>キャラクター名前トレーナー</h1>
  <span class="count" id="headCount"></span>
</header>

<main>
  <!-- ============ 学習 ============ -->
  <section class="panel active" id="panel-study">
    <div class="chips" id="studyFolders"></div>
    <div class="settings">
      <select id="setMode">
        <option value="recall">自由想起</option>
        <option value="choice4">4択</option>
      </select>
      <select id="setDir">
        <option value="i2n">画像 → 名前</option>
        <option value="n2i">名前 → 画像</option>
      </select>
      <select id="setScope">
        <option value="due">今日の分</option>
        <option value="weak">苦手だけ</option>
        <option value="all">全部</option>
      </select>
      <select id="setGroup"><option value="">グループ：すべて</option></select>
    </div>
    <div id="stage"></div>
  </section>

  <!-- ============ 一覧 ============ -->
  <section class="panel" id="panel-list">
    <div class="settings">
      <label class="btn filebtn" style="margin:0">画像を追加
        <input type="file" id="fileInput" accept="image/*" multiple></label>
      <label class="btn filebtn" id="dirBtnWrap" style="margin:0">フォルダごと追加
        <input type="file" id="dirInput" webkitdirectory directory multiple></label>
      <button class="btn" id="selectBtn">選択</button>
      <button class="btn" id="exportBtn">書き出す</button>
    </div>
    <div class="chips" id="listFolders"></div>
    <div id="listBody"></div>
    <div class="actionbar" id="actionBar" hidden>
      <button class="btn sm" id="selAll">全選択</button>
      <button class="btn sm primary" id="selMove">フォルダへ移動</button>
      <button class="btn sm danger" id="selDel">削除</button>
    </div>
  </section>

  <!-- ============ 記録 ============ -->
  <section class="panel" id="panel-stats"><div id="statsBody"></div></section>
</main>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="study">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H4z"/><path d="M9 20h6"/><path d="M12 16v4"/></svg>学習</button>
  <button role="tab" aria-selected="false" data-tab="list">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>一覧</button>
  <button role="tab" aria-selected="false" data-tab="stats">
    <svg viewBox="0 0 24 24"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>記録</button>
</nav>

<dialog id="editDlg">
  <form method="dialog" class="dlg-body">
    <img id="edImg" alt="">
    <div><label for="edName">名前</label><input type="text" id="edName" autocomplete="off"></div>
    <div><label for="edFolder">フォルダ</label>
      <input type="text" id="edFolder" autocomplete="off" list="folderList" placeholder="未分類">
      <datalist id="folderList"></datalist></div>
    <div><label for="edGroup">グループ（似たもの同士をまとめると4択が難しくなります）</label>
      <input type="text" id="edGroup" autocomplete="off" list="groupList">
      <datalist id="groupList"></datalist></div>
    <div><label for="edNote">覚える手がかり</label>
      <textarea id="edNote" placeholder="髪の色、持ち物、他と見分ける決め手など"></textarea></div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" type="submit">閉じる</button>
      <button class="btn primary" value="save" type="submit">保存</button>
    </div>
    <button class="btn danger" id="edDelete" type="button">このキャラを削除</button>
  </form>
</dialog>

<dialog id="folderDlg">
  <form method="dialog" class="dlg-body">
    <h2 id="fdTitle">フォルダへ移動</h2>
    <div><label for="fdName">フォルダ名（空欄にすると未分類に戻ります）</label>
      <input type="text" id="fdName" autocomplete="off" list="folderList2" placeholder="未分類">
      <datalist id="folderList2"></datalist></div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" type="submit">やめる</button>
      <button class="btn primary" value="ok" type="submit">実行</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============ ストレージ ============ */
const DB_NAME = "charTrainer", STORE = "cards";
let db = null;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const store = mode => db.transaction(STORE, mode).objectStore(STORE);
const idbAll = () => new Promise((res, rej) => {
  const r = store("readonly").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
});
const idbPut = rec => new Promise((res, rej) => {
  const r = store("readwrite").put(rec); r.onsuccess = () => res(); r.onerror = () => rej(r.error);
});
const idbDel = id => new Promise((res, rej) => {
  const r = store("readwrite").delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error);
});

/* ============ 状態 ============ */
let cards = [];
const urlCache = new Map();
let current = null, sessionDone = 0;
let studyFolders = new Set();      // 空 = すべて
let listFolder = null;             // null = すべて
let selecting = false;
const selected = new Set();

const UNFILED = "未分類";
const FOLDER_MAX = 100;            // 1フォルダに入れられる上限
const INTERVALS = [0, 1, 3, 7, 16, 35];
const dayMs = 86400000;
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fld = c => c.folder || UNFILED;

function urlFor(card) {
  if (!urlCache.has(card.id)) urlCache.set(card.id, URL.createObjectURL(card.blob));
  return urlCache.get(card.id);
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2200);
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const folders = () => [...new Set(cards.map(fld))].sort((a, b) =>
  a === UNFILED ? 1 : b === UNFILED ? -1 : a.localeCompare(b, "ja"));
const folderCount = name => cards.filter(c => fld(c) === (name || UNFILED)).length;
const roomIn = name => Math.max(0, FOLDER_MAX - folderCount(name));

/* ============ 取り込み ============ */
function nameFromFile(filename) {
  let n = filename.replace(/\.[^.]+$/, "");
  n = n.replace(/^\d{1,4}[\s_\-.]+/, "");
  n = n.replace(/[_]+/g, " ");
  return n.trim() || filename;
}
function folderFromPath(file) {
  const p = file.webkitRelativePath || "";
  const parts = p.split("/").filter(Boolean);
  return parts.length >= 2 ? parts[parts.length - 2] : "";
}

async function importFiles(files, folderOverride) {
  const imgs = [...files].filter(f => f.type.startsWith("image/"));
  if (!imgs.length) { toast("画像が見つかりませんでした"); return; }
  const counts = new Map(folders().map(f => [f, folderCount(f)]));
  const cnt = f => counts.get(f || UNFILED) ?? 0;
  let added = 0, dupe = 0, overflow = 0, failed = false;
  const fullFolders = new Set();
  for (const f of imgs) {
    const folder = folderOverride !== undefined ? folderOverride : folderFromPath(f);
    const key = folder || UNFILED;
    const name = nameFromFile(f.name);
    if (cards.some(c => c.name === name && fld(c) === key)) { dupe++; continue; }
    if (cnt(folder) >= FOLDER_MAX) { overflow++; fullFolders.add(key); continue; }
    const rec = { id: crypto.randomUUID(), name, folder: folder || "", group: "", note: "",
                  blob: f, level: 0, due: today(), ok: 0, ng: 0, seen: 0 };
    try { await idbPut(rec); cards.push(rec); counts.set(key, cnt(folder) + 1); added++; }
    catch (e) { console.error(e); failed = true; break; }
  }
  refreshAll();
  if (failed) { toast("保存できませんでした。端末の空き容量を確認してください"); return; }
  const notes = [];
  if (dupe) notes.push(`同名${dupe}体は除外`);
  if (overflow) notes.push(`${[...fullFolders].join("・")}が上限${FOLDER_MAX}体のため${overflow}体は未登録`);
  toast(`${added}体を追加しました${notes.length ? `（${notes.join("／")}）` : ""}`);
}

document.getElementById("dirInput").addEventListener("change", e => {
  const files = e.target.files; e.target.value = "";
  importFiles(files);           // フォルダ名を自動で割り当て
});
document.getElementById("fileInput").addEventListener("change", e => {
  const files = [...e.target.files]; e.target.value = "";
  if (!files.length) return;
  // 一覧で特定フォルダを開いていればそこへ、そうでなければ行き先を尋ねる
  if (listFolder && listFolder !== UNFILED) { importFiles(files, listFolder); return; }
  askFolder("追加先のフォルダ", "", name => importFiles(files, name));
});
// webkitdirectory 非対応（iOS など）ではボタンを隠す
if (!("webkitdirectory" in document.createElement("input"))) {
  document.getElementById("dirBtnWrap").hidden = true;
}

/* ============ フォルダ入力ダイアログ ============ */
const folderDlg = document.getElementById("folderDlg");
let folderCb = null;
function askFolder(title, initial, cb) {
  document.getElementById("fdTitle").textContent = title;
  document.getElementById("fdName").value = initial || "";
  document.getElementById("folderList2").innerHTML =
    folders().filter(f => f !== UNFILED).map(f => `<option value="${esc(f)}">`).join("");
  folderCb = cb;
  folderDlg.showModal();
}
folderDlg.addEventListener("close", () => {
  const cb = folderCb; folderCb = null;
  if (folderDlg.returnValue !== "ok" || !cb) return;
  cb(document.getElementById("fdName").value.trim());
});

/* ============ 出題 ============ */
function pool() {
  const g = document.getElementById("setGroup").value;
  const scope = document.getElementById("setScope").value;
  let p = cards.filter(c => studyFolders.size === 0 || studyFolders.has(fld(c)));
  if (g) p = p.filter(c => c.group === g);
  if (scope === "due") p = p.filter(c => c.due <= today());
  if (scope === "weak") p = p.filter(c => c.ng > 0 && c.ng >= c.ok);
  return p;
}
function pickNext() {
  let p = pool();
  if (!p.length) return null;
  if (p.length > 1 && current) p = p.filter(c => c.id !== current.id);
  const weight = c => (c.seen === 0 ? 8 : 1) + (5 - Math.min(c.level, 5));
  const total = p.reduce((s, c) => s + weight(c), 0);
  let r = Math.random() * total;
  for (const c of p) { r -= weight(c); if (r <= 0) return c; }
  return p[p.length - 1];
}
function distractors(card, n) {
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
  const scope = cards.filter(c => c.id !== card.id &&
    (studyFolders.size === 0 || studyFolders.has(fld(c))));
  const sameGroup = scope.filter(c => card.group && c.group === card.group);
  const sameFolder = scope.filter(c => !(card.group && c.group === card.group) && fld(c) === fld(card));
  const rest = scope.filter(c => !sameGroup.includes(c) && !sameFolder.includes(c));
  return [...shuffle(sameGroup), ...shuffle(sameFolder), ...shuffle(rest)].slice(0, n);
}
async function grade(good) {
  const c = current;
  c.seen++;
  if (good) { c.ok++; c.level = Math.min(c.level + 1, INTERVALS.length - 1); }
  else { c.ng++; c.level = 0; }
  c.due = today() + INTERVALS[c.level] * dayMs;
  await idbPut(c);
  sessionDone++;
  renderStudy(); updateHead();
}

/* ============ 学習画面 ============ */
function renderStudyFolders() {
  const box = document.getElementById("studyFolders");
  const fs = folders();
  if (!cards.length) { box.innerHTML = ""; return; }
  const counts = Object.fromEntries(fs.map(f => [f, cards.filter(c => fld(c) === f).length]));
  box.innerHTML =
    `<button class="chip" data-f="" aria-pressed="${studyFolders.size === 0}">すべて<span class="n">${cards.length}</span></button>` +
    fs.map(f => `<button class="chip" data-f="${esc(f)}" aria-pressed="${studyFolders.has(f)}">${esc(f)}<span class="n">${counts[f]}${counts[f] >= FOLDER_MAX ? "・満" : ""}</span></button>`).join("");
  box.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
    const f = ch.dataset.f;
    if (!f) studyFolders.clear();
    else { studyFolders.has(f) ? studyFolders.delete(f) : studyFolders.add(f); }
    sessionDone = 0;
    updateGroupSelect(); renderStudyFolders(); renderStudy();
  });
}
function renderStudy() {
  const stage = document.getElementById("stage");
  if (!cards.length) {
    stage.innerHTML = `<div class="empty"><h2>まだキャラクターがいません</h2>
      <p>「一覧」タブから画像を追加してください。ファイル名がそのまま名前になります。</p>
      <button class="btn primary" id="goList">画像を追加する</button></div>`;
    document.getElementById("goList").onclick = () => document.querySelector("[data-tab=list]").click();
    return;
  }
  current = pickNext();
  if (!current) {
    const scope = document.getElementById("setScope").value;
    stage.innerHTML = `<div class="empty">
      <h2>${scope === "due" ? "今日の分は終わりです" : "該当するキャラがいません"}</h2>
      <p>${scope === "due" ? "おつかれさまでした。続けるなら「全部」に切り替えてください。"
                           : "フォルダやグループの絞り込みを見直してください。"}</p></div>`;
    return;
  }
  const mode = document.getElementById("setMode").value;
  const dir = document.getElementById("setDir").value;
  const c = current;
  const promptHtml = dir === "i2n"
    ? `<div class="imgwrap"><img src="${urlFor(c)}" alt=""></div>`
    : `<div class="prompt-name card">${esc(c.name)}</div>`;
  stage.innerHTML = `
    <div class="meta-row">
      <span class="pill">${c.seen === 0 ? "はじめて" : `レベル ${c.level}／5`}</span>
      <span class="pill">${esc(fld(c))}</span>
      <span>正 ${c.ok}・誤 ${c.ng}</span>
      <span style="margin-left:auto">今回 ${sessionDone} 問</span></div>
    ${promptHtml}<div id="interact"></div>`;
  const box = document.getElementById("interact");
  mode === "choice4" ? renderChoices(box, c, dir) : renderRecall(box, c, dir);
}
function renderRecall(box, c, dir) {
  box.innerHTML = `<div class="answer-slot"><button class="reveal-btn" id="revealBtn">タップして答えを見る</button></div>`;
  document.getElementById("revealBtn").onclick = () => {
    const answer = dir === "i2n"
      ? `<div><div class="answer-name">${esc(c.name)}</div>${c.note ? `<div class="answer-note">${esc(c.note)}</div>` : ""}</div>`
      : `<div class="imgwrap"><img src="${urlFor(c)}" alt=""></div>`;
    box.innerHTML = `<div class="answer-slot">${answer}</div>
      <div class="grade" style="margin-top:14px">
        <button class="btn again" id="gNg">できなかった</button>
        <button class="btn good" id="gOk">できた</button></div>`;
    document.getElementById("gNg").onclick = () => grade(false);
    document.getElementById("gOk").onclick = () => grade(true);
  };
}
function renderChoices(box, c, dir) {
  const opts = [c, ...distractors(c, 3)].map(v => [Math.random(), v])
    .sort((a, b) => a[0] - b[0]).map(v => v[1]);
  if (opts.length < 2) { renderRecall(box, c, dir); return; }
  box.innerHTML = `<div class="choices">` + opts.map((o, i) =>
    dir === "i2n" ? `<button class="choice" data-i="${i}">${esc(o.name)}</button>`
                  : `<button class="choice choice-img" data-i="${i}"><img src="${urlFor(o)}" alt=""></button>`
  ).join("") + `</div>`;
  box.querySelectorAll(".choice").forEach(btn => {
    btn.onclick = () => {
      const correct = opts[+btn.dataset.i].id === c.id;
      box.querySelectorAll(".choice").forEach((b, i) => {
        b.disabled = true;
        if (opts[i].id === c.id) b.classList.add("correct");
        else if (b === btn) b.classList.add("wrong");
      });
      if (!correct && dir === "i2n" && c.note)
        box.insertAdjacentHTML("beforeend", `<div class="answer-note" style="margin-top:10px">${esc(c.note)}</div>`);
      setTimeout(() => grade(correct), correct ? 550 : 1500);
    };
  });
}

/* ============ 一覧 ============ */
function renderListFolders() {
  const box = document.getElementById("listFolders");
  if (!cards.length) { box.innerHTML = ""; return; }
  const fs = folders();
  box.innerHTML =
    `<button class="chip" data-f="" aria-pressed="${listFolder === null}">すべて<span class="n">${cards.length}</span></button>` +
    fs.map(f => { const n = folderCount(f);
      return `<button class="chip" data-f="${esc(f)}" aria-pressed="${listFolder === f}">${esc(f)}<span class="n">${n}${n >= FOLDER_MAX ? "・満" : ""}</span></button>`; }).join("");
  box.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
    listFolder = ch.dataset.f || null;
    renderListFolders(); renderList();
  });
}
function renderList() {
  const body = document.getElementById("listBody");
  if (!cards.length) {
    body.innerHTML = `<div class="empty"><h2>画像を追加してはじめましょう</h2>
      <p>画像をまとめて選ぶと、ファイル名がそのまま名前になります。</p>
      <div class="hint">例：<code>アリス.jpg</code> →「アリス」<br>
      「フォルダごと追加」なら、フォルダ名がそのまま分類になります。</div></div>`;
    return;
  }
  const shown = cards.filter(c => listFolder === null || fld(c) === listFolder)
                     .sort((a, b) => a.name.localeCompare(b.name, "ja"));
  body.innerHTML = `<div class="grid">` + shown.map(c => `
    <div class="tile" data-id="${c.id}" aria-checked="${selected.has(c.id)}">
      <div class="th"><img src="${urlFor(c)}" alt="" loading="lazy"></div>
      <div class="tick">✓</div>
      <div class="nm">${esc(c.name)}<span class="lv">${esc(fld(c))}・Lv${c.level}</span></div>
    </div>`).join("") + `</div>` +
    (listFolder && listFolder !== UNFILED
      ? `<button class="btn sm wide" style="margin-top:12px" id="renameFolder">「${esc(listFolder)}」の名前を変える</button>` : "") +
    `<div class="hint">タイルをタップすると名前やフォルダを編集できます。まとめて動かすときは「選択」を押してください。
      1つのフォルダに入れられるのは${FOLDER_MAX}体までです${listFolder && listFolder !== UNFILED ? `（このフォルダの空き ${roomIn(listFolder)}体）` : ""}。</div>`;

  body.querySelectorAll(".tile").forEach(t => {
    t.onclick = () => {
      const card = cards.find(c => c.id === t.dataset.id);
      if (!selecting) { openEdit(card); return; }
      selected.has(card.id) ? selected.delete(card.id) : selected.add(card.id);
      t.setAttribute("aria-checked", selected.has(card.id));
      updateActionBar();
    };
  });
  const rn = document.getElementById("renameFolder");
  if (rn) rn.onclick = () => askFolder(`「${listFolder}」の名前を変える`, listFolder, async name => {
    const key = name || UNFILED;
    const targets = cards.filter(c => fld(c) === listFolder);
    if (key !== listFolder && targets.length > roomIn(name)) {
      toast(`「${key}」に統合すると上限${FOLDER_MAX}体を超えます（空き${roomIn(name)}体）`);
      return;
    }
    for (const c of targets) { c.folder = name; await idbPut(c); }
    listFolder = name || UNFILED;
    refreshAll(); toast(`${targets.length}体のフォルダを変更しました`);
  });
}
function updateActionBar() {
  const bar = document.getElementById("actionBar");
  bar.hidden = !selecting;
  document.getElementById("selMove").disabled = selected.size === 0;
  document.getElementById("selDel").disabled = selected.size === 0;
  document.getElementById("selMove").textContent =
    selected.size ? `${selected.size}体をフォルダへ移動` : "フォルダへ移動";
}
document.getElementById("selectBtn").onclick = () => {
  selecting = !selecting;
  selected.clear();
  document.body.classList.toggle("selecting", selecting);
  document.getElementById("selectBtn").textContent = selecting ? "選択をやめる" : "選択";
  updateActionBar(); renderList();
};
document.getElementById("selAll").onclick = () => {
  const shown = cards.filter(c => listFolder === null || fld(c) === listFolder);
  const allOn = shown.every(c => selected.has(c.id));
  shown.forEach(c => allOn ? selected.delete(c.id) : selected.add(c.id));
  updateActionBar(); renderList();
};
document.getElementById("selMove").onclick = () => {
  askFolder(`${selected.size}体をフォルダへ移動`, listFolder && listFolder !== UNFILED ? listFolder : "", async name => {
    const key = name || UNFILED;
    const targets = cards.filter(c => selected.has(c.id) && fld(c) !== key);
    const room = roomIn(name);
    if (targets.length > room) {
      toast(room === 0
        ? `「${key}」は上限${FOLDER_MAX}体です。空きがありません`
        : `「${key}」の空きは${room}体です（上限${FOLDER_MAX}体）`);
      return;
    }
    for (const c of targets) { c.folder = name; await idbPut(c); }
    selected.clear();
    refreshAll(); toast(`${targets.length}体を移動しました`);
  });
};
document.getElementById("selDel").onclick = async () => {
  if (!confirm(`${selected.size}体を削除します。よろしいですか。`)) return;
  const ids = [...selected];
  for (const id of ids) { await idbDel(id); urlCache.delete(id); }
  cards = cards.filter(c => !selected.has(c.id));
  selected.clear();
  refreshAll(); toast(`${ids.length}体を削除しました`);
};

/* ============ 編集 ============ */
const dlg = document.getElementById("editDlg");
let editing = null;
function openEdit(card) {
  editing = card;
  document.getElementById("edImg").src = urlFor(card);
  document.getElementById("edName").value = card.name;
  document.getElementById("edFolder").value = card.folder || "";
  document.getElementById("edGroup").value = card.group || "";
  document.getElementById("edNote").value = card.note || "";
  document.getElementById("folderList").innerHTML =
    folders().filter(f => f !== UNFILED).map(f => `<option value="${esc(f)}">`).join("");
  document.getElementById("groupList").innerHTML =
    [...new Set(cards.map(c => c.group).filter(Boolean))].map(g => `<option value="${esc(g)}">`).join("");
  dlg.showModal();
}
dlg.addEventListener("close", async () => {
  if (dlg.returnValue !== "save" || !editing) { editing = null; return; }
  const nm = document.getElementById("edName").value.trim();
  if (nm) editing.name = nm;
  const newFolder = document.getElementById("edFolder").value.trim();
  if ((newFolder || UNFILED) === fld(editing)) { /* 変更なし */ }
  else if (roomIn(newFolder) === 0) toast(`「${newFolder || UNFILED}」は上限${FOLDER_MAX}体です。移動できません`);
  else editing.folder = newFolder;
  editing.group = document.getElementById("edGroup").value.trim();
  editing.note = document.getElementById("edNote").value.trim();
  await idbPut(editing);
  editing = null; refreshAll();
});
document.getElementById("edDelete").onclick = async () => {
  if (!editing || !confirm(`「${editing.name}」を削除します。よろしいですか。`)) return;
  await idbDel(editing.id); urlCache.delete(editing.id);
  cards = cards.filter(c => c.id !== editing.id);
  editing = null; dlg.close("cancel"); refreshAll(); toast("削除しました");
};

/* ============ 記録 ============ */
function renderStats() {
  const body = document.getElementById("statsBody");
  if (!cards.length) { body.innerHTML = `<div class="empty"><p>学習を始めると、ここに記録が並びます。</p></div>`; return; }
  const learned = cards.filter(c => c.level >= 3).length;
  const untouched = cards.filter(c => c.seen === 0).length;
  const due = cards.filter(c => c.due <= today()).length;
  const ok = cards.reduce((s, c) => s + c.ok, 0), ng = cards.reduce((s, c) => s + c.ng, 0);
  const rate = ok + ng ? Math.round(ok / (ok + ng) * 100) : 0;
  const weak = cards.filter(c => c.ng > 0).sort((a, b) =>
    (b.ng / Math.max(b.ok + b.ng, 1)) - (a.ng / Math.max(a.ok + a.ng, 1)) || b.ng - a.ng).slice(0, 20);

  body.innerHTML = `
    <div class="statgrid">
      <div class="card stat"><b>${cards.length}</b><span>登録数</span></div>
      <div class="card stat"><b>${learned}</b><span>定着（Lv3以上）</span></div>
      <div class="card stat"><b>${untouched}</b><span>未学習</span></div>
      <div class="card stat"><b>${due}</b><span>今日の分</span></div>
      <div class="card stat"><b>${rate}%</b><span>通算正答率</span></div>
    </div>
    <h3>フォルダごとの状況</h3>
    <div class="card" style="padding:4px 12px"><table>
      <thead><tr><th>フォルダ</th><th class="num">数</th><th class="num">定着</th><th class="num">正答率</th></tr></thead>
      <tbody>${folders().map(f => {
        const g = cards.filter(c => fld(c) === f);
        const o = g.reduce((s, c) => s + c.ok, 0), x = g.reduce((s, c) => s + c.ng, 0);
        return `<tr><td>${esc(f)}</td><td class="num">${g.length}</td>
          <td class="num">${g.filter(c => c.level >= 3).length}</td>
          <td class="num">${o + x ? Math.round(o / (o + x) * 100) + "%" : "—"}</td></tr>`;
      }).join("")}</tbody></table></div>
    ${weak.length ? `<h3>間違えやすいキャラ</h3>
    <div class="card" style="padding:4px 12px"><table>
      <thead><tr><th>名前</th><th>フォルダ</th><th class="num">正</th><th class="num">誤</th></tr></thead>
      <tbody>${weak.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(fld(c))}</td>
        <td class="num">${c.ok}</td><td class="num">${c.ng}</td></tr>`).join("")}</tbody></table></div>` : ""}
    <div class="hint">画像と記録はこの端末のブラウザの中に保存されています。iPhoneでは、
      共有ボタンから「ホーム画面に追加」しておくと消えにくくなります。</div>
    <button class="btn danger wide" style="margin-top:14px" id="resetBtn">学習記録だけをリセット</button>`;

  document.getElementById("resetBtn").onclick = async () => {
    if (!confirm("正誤とレベルをすべて0に戻します。画像・名前・フォルダは残ります。")) return;
    for (const c of cards) { c.level = 0; c.ok = 0; c.ng = 0; c.seen = 0; c.due = today(); await idbPut(c); }
    sessionDone = 0; refreshAll(); toast("記録をリセットしました");
  };
}

/* ============ 書き出し ============ */
document.getElementById("exportBtn").onclick = () => {
  if (!cards.length) { toast("まだ登録がありません"); return; }
  const rows = [["フォルダ", "名前", "グループ", "手がかり", "レベル", "正", "誤"],
    ...cards.map(c => [fld(c), c.name, c.group, c.note, c.level, c.ok, c.ng])];
  const csv = "\uFEFF" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "キャラクター一覧.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("CSVを書き出しました");
};

/* ============ 共通 ============ */
function updateGroupSelect() {
  const sel = document.getElementById("setGroup"), keep = sel.value;
  const scoped = cards.filter(c => studyFolders.size === 0 || studyFolders.has(fld(c)));
  const gs = [...new Set(scoped.map(c => c.group).filter(Boolean))].sort();
  sel.innerHTML = `<option value="">グループ：すべて</option>` +
    gs.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join("");
  sel.value = gs.includes(keep) ? keep : "";
}
function updateHead() {
  const due = cards.filter(c => c.due <= today()).length;
  document.getElementById("headCount").textContent = cards.length ? `${cards.length}体・今日 ${due}` : "";
}
function refreshAll() {
  // 消えたフォルダを選択状態から外す
  const exist = new Set(folders());
  [...studyFolders].forEach(f => { if (!exist.has(f)) studyFolders.delete(f); });
  if (listFolder !== null && !exist.has(listFolder)) listFolder = null;
  updateGroupSelect(); updateHead();
  renderStudyFolders(); renderStudy();
  renderListFolders(); renderList(); updateActionBar();
  if (document.getElementById("panel-stats").classList.contains("active")) renderStats();
}

document.querySelectorAll("nav button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b === btn));
    document.querySelectorAll(".panel").forEach(p =>
      p.classList.toggle("active", p.id === "panel-" + btn.dataset.tab));
    if (btn.dataset.tab === "stats") renderStats();
    if (btn.dataset.tab === "list") { renderListFolders(); renderList(); }
  };
});
["setMode", "setDir", "setScope", "setGroup"].forEach(id =>
  document.getElementById(id).addEventListener("change", () => { sessionDone = 0; renderStudy(); }));

(async function init() {
  try { db = await openDB(); cards = await idbAll(); }
  catch (e) {
    console.error(e);
    document.querySelector("main").innerHTML =
      `<div class="empty"><h2>保存領域を開けませんでした</h2>
       <p>プライベートブラウズを解除するか、別のブラウザでお試しください。</p></div>`;
    return;
  }
  cards.forEach(c => {
    c.folder ??= ""; c.group ??= ""; c.note ??= "";
    c.level ??= 0; c.ok ??= 0; c.ng ??= 0; c.seen ??= 0; c.due ??= today();
  });
  refreshAll();
})();
</script>
</body>
</html>
